<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 13</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--green); font-family: monospace; }
        .card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; position: relative; }
        .btn-connect { 
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan); 
            padding: 15px 40px; font-size: 16px; cursor: pointer; font-weight: bold; 
            border-radius: 8px; transition: 0.3s; display: block; margin: 0 auto 20px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-connect:disabled { border-color: #333; color: #333; cursor: wait; }
        .btn-connect.active { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #444; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 18px 15px; border-bottom: 1px solid #111; vertical-align: middle; }
        .token-tag { display: inline-block; background: #161625; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin: 4px; border: 1px solid #222; }
        #walletAddr { text-align: center; font-size: 10px; color: #555; font-family: monospace; margin-top: 10px; }
        .error-msg { color: var(--red); font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">VALOR TOTAL ESTIMADO</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">STATUS CARTEIRA</div>
            <div class="stat-value" id="walletStatus" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <button id="mainBtn" class="btn-connect" onclick="handleAction()">Conectar Carteira</button>
        <div id="walletAddr">Aguardando...</div>
        
        <table>
            <thead>
                <tr>
                    <th>REDE</th>
                    <th>SALDO NATIVO</th>
                    <th>TOKENS (ERC-20)</th>
                    <th>ESTADO</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    const ERC20_ABI = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)", "function symbol() view returns (string)"];
    
    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", rpc: "https://rpc.ankr.com/eth", tokens: ["0xdAC17F958D2ee523a2206206994597C13D831ec7"] },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", rpc: "https://rpc.ankr.com/bsc", tokens: ["0x55d398326f99059fF775485246999027B3197955"] },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", rpc: "https://rpc.ankr.com/polygon", tokens: ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F"] }
        ]
    };

    let userAddress = "";

    async function init() {
        renderTable();
        if (window.ethereum) {
            const accs = await window.ethereum.request({ method: 'eth_accounts' });
            if (accs.length > 0) { userAddress = accs[0]; updateUI(true); }
        }
    }

    function renderTable() {
        document.getElementById('mainTable').innerHTML = config.chains.map(c => `
            <tr id="row-${c.id}">
                <td><strong>${c.name}</strong></td>
                <td id="bal-${c.id}">---</td>
                <td id="tokens-${c.id}">---</td>
                <td id="status-${c.id}" style="font-size:10px; color:#444;">Aguardando...</td>
            </tr>
        `).join('');
    }

    function updateUI(isConnected) {
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('walletStatus');
        if(isConnected) {
            btn.innerText = "Executar Scan Agora";
            btn.classList.add('active');
            status.innerText = "ONLINE"; status.style.color = "var(--green)";
            document.getElementById('walletAddr').innerText = `WALLET: ${userAddress}`;
        }
    }

    async function handleAction() {
        if (!userAddress) {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accs[0]; updateUI(true);
        } else {
            runFullScan();
        }
    }

    async function runFullScan() {
        const btn = document.getElementById('mainBtn');
        btn.disabled = true; btn.innerText = "ESCANEANDO...";
        
        let grandTotalUSD = 0;
        let prices = {};

        try {
            const pRes = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=ethereum,binancecoin,matic-network,tether&vs_currencies=usd`);
            prices = await pRes.json();
        } catch (e) { console.error("Erro ao buscar preços"); }

        for (const chain of config.chains) {
            try {
                document.getElementById(`status-${chain.id}`).innerText = "Conectando RPC...";
                const provider = new ethers.JsonRpcProvider(chain.rpc);
                
                // Saldo Nativo
                const balance = await provider.getBalance(userAddress);
                const ethAmt = parseFloat(ethers.formatEther(balance));
                const ethUsd = ethAmt * (prices[chain.cgId]?.usd || 0);
                grandTotalUSD += ethUsd;
                
                document.getElementById(`bal-${chain.id}`).innerHTML = `<b>${ethAmt.toFixed(4)} ${chain.sym}</b><br><span style="font-size:10px; color:#555;">$${ethUsd.toFixed(2)}</span>`;

                // Saldo Tokens
                const tokenContainer = document.getElementById(`tokens-${chain.id}`);
                tokenContainer.innerHTML = "";
                
                for (const tAddr of chain.tokens) {
                    const contract = new ethers.Contract(tAddr, ERC20_ABI, provider);
                    const [raw, dec, sym] = await Promise.all([contract.balanceOf(userAddress), contract.decimals(), contract.symbol()]);
                    const formatted = parseFloat(ethers.formatUnits(raw, dec));
                    
                    if (formatted > 0.01) {
                        const valUsd = formatted * (prices[sym.toLowerCase()]?.usd || 1);
                        grandTotalUSD += valUsd;
                        tokenContainer.innerHTML += `<div class="token-tag">${sym}: ${formatted.toLocaleString()}</div>`;
                    }
                }
                document.getElementById(`status-${chain.id}`).innerText = "✅ Finalizado";
                document.getElementById(`status-${chain.id}`).style.color = "var(--green)";
            } catch (err) {
                document.getElementById(`status-${chain.id}`).innerHTML = `<span class="error-msg">❌ Erro na Rede</span>`;
            }
        }

        document.getElementById('totalUSD').innerText = `$${grandTotalUSD.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        btn.disabled = false; btn.innerText = "REPETIR SCAN";
    }

    init();
</script>
</body>
</html>

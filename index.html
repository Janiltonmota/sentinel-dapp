<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 27</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .btn-auth { padding: 12px 30px; font-size: 14px; cursor: pointer; border-radius: 8px; font-weight: bold; text-transform: uppercase; transition: 0.3s; min-width: 220px; border: 2px solid var(--cyan); background: transparent; color: var(--cyan); }
        .btn-auth.mode-disconnect { border-color: var(--red); color: var(--red); }
        .card { background: var(--panel); border: 1px solid var(--gray); padding: 35px; border-radius: 20px; text-align: center; }
        .btn-scan { background: var(--cyan); color: #000; border: none; padding: 18px 50px; font-size: 18px; cursor: pointer; font-weight: bold; border-radius: 12px; margin-bottom: 25px; text-transform: uppercase; }
        #walletDisplay { font-size: 14px; color: var(--cyan); font-family: monospace; margin-bottom: 35px; background: #0d0d1a; padding: 15px; border-radius: 10px; border: 1px solid #1a1a2e; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #666; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #111; color: #fff; }
        .rpc-select { background: #0d0d1a; color: #fff; border: 1px solid var(--gray); padding: 8px; font-size: 10px; border-radius: 4px; width: 100%; max-width: 280px; }
        .status-badge { font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav"><button id="authBtn" class="btn-auth" onclick="handleAuth()">Conectar Carteira</button></div>
    <div class="card">
        <button id="scanBtn" class="btn-scan" onclick="runSecurityScan()" style="display:none;">Repetir Scan Completo</button>
        <div id="walletDisplay">AGUARDANDO CONEXÃO</div>
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Escolher RPC (Chainlist)</th>
                    <th>Saldo Nativo</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="netTable"></tbody>
        </table>
    </div>
</div>

<script>
    const chainData = [
        { name: "Ethereum", chainId: 1, symbol: "ETH", rpcs: ["https://cloudflare-eth.com", "https://eth.meowrpc.com", "https://1rpc.io/eth", "https://rpc.ankr.com/eth", "https://ethereum.publicnode.com"] },
        { name: "BNB Chain", chainId: 56, symbol: "BNB", rpcs: ["https://bsc-dataseed.binance.org", "https://binance.llamarpc.com", "https://rpc.ankr.com/bsc", "https://1rpc.io/bnb", "https://bsc.meowrpc.com"] },
        { name: "Polygon", chainId: 137, symbol: "POL", rpcs: ["https://polygon-rpc.com", "https://polygon-bor-rpc.publicnode.com", "https://1rpc.io/matic", "https://rpc.ankr.com/polygon", "https://polygon.llamarpc.com"] },
        { name: "Arbitrum", chainId: 42161, symbol: "ETH", rpcs: ["https://arb1.arbitrum.io/rpc", "https://arbitrum.llamarpc.com", "https://1rpc.io/arb", "https://rpc.ankr.com/arbitrum", "https://arbitrum-one.publicnode.com"] }
    ];

    let currentAccount = "";

    async function handleAuth() {
        if (!window.ethereum) return alert("Instale o MetaMask");
        try {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            currentAccount = accs[0];
            updateUI(true);
        } catch (e) { console.error(e); }
    }

    function updateUI(connected) {
        document.getElementById('scanBtn').style.display = connected ? "inline-block" : "none";
        document.getElementById('walletDisplay').innerText = connected ? `CARTEIRA: ${currentAccount}` : "AGUARDANDO CONEXÃO";
        if (connected) runSecurityScan();
    }

    function renderTable() {
        document.getElementById('netTable').innerHTML = chainData.map(c => `
            <tr>
                <td><b style="color:var(--cyan)">${c.name}</b></td>
                <td><select class="rpc-select" id="sel-${c.chainId}">${c.rpcs.map(url => `<option value="${url}">${url}</option>`).join('')}</select></td>
                <td id="bal-${c.chainId}">---</td>
                <td id="state-${c.chainId}"><span class="status-badge" style="color:#444">PRONTO</span></td>
            </tr>
        `).join('');
    }

    async function runSecurityScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "PROCESSANDO...";

        for (const chain of chainData) {
            const rpc = document.getElementById(`sel-${chain.chainId}`).value;
            const stateEl = document.getElementById(`state-${chain.chainId}`);
            stateEl.innerHTML = `<span style="color:var(--cyan)">CONECTANDO...</span>`;

            try {
                const provider = new ethers.JsonRpcProvider(rpc);
                // Aumentado para 15 segundos para evitar o erro de Timeout prematuro
                const bal = await Promise.race([
                    provider.getBalance(currentAccount),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('T')), 15000))
                ]);
                
                document.getElementById(`bal-${chain.chainId}`).innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(4)} ${chain.symbol}`;
                stateEl.innerHTML = `<span style="color:var(--green)">✅ OK</span>`;
            } catch (e) {
                stateEl.innerHTML = `<span style="color:var(--red)">TIMEOUT - TROQUE O RPC</span>`;
            }
        }
        btn.disabled = false; btn.innerText = "REPETIR SCAN COMPLETO";
    }

    renderTable();
</script>
</body>
</html>

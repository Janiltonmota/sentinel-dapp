<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 17</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .btn-exit { 
            background: transparent; border: 2px solid var(--red); color: var(--red); 
            padding: 10px 20px; font-size: 12px; cursor: pointer; border-radius: 8px; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s;
        }
        .btn-exit:hover { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--green); font-family: monospace; margin-top: 10px; }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 30px; border-radius: 20px; text-align: center; }
        
        .btn-main { 
            background: var(--cyan); color: #000; border: none; padding: 20px 50px; font-size: 18px; 
            cursor: pointer; font-weight: bold; border-radius: 12px; transition: 0.3s; 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;
        }
        .btn-main:hover { box-shadow: 0 0 30px var(--cyan); transform: scale(1.02); }
        .btn-main:disabled { background: #1a1a2e; color: #444; cursor: wait; }

        #walletInfo { color: #ffffff; font-family: monospace; font-size: 12px; margin-bottom: 30px; display: block; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #666; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 20px 15px; border-bottom: 1px solid #111; color: #fff; font-size: 14px; }

        /* Botões de RPC */
        .rpc-switcher { display: flex; gap: 5px; margin-top: 5px; }
        .rpc-btn { 
            background: #161625; border: 1px solid #333; color: #888; font-size: 9px; 
            padding: 3px 6px; cursor: pointer; border-radius: 3px; 
        }
        .rpc-btn.active { border-color: var(--cyan); color: var(--cyan); background: #002222; }

        .badge { font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #1a1a2e; }
        .token-tag { background: #002222; color: var(--green); padding: 4px 8px; border-radius: 4px; border: 1px solid #004444; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button id="exitBtn" class="btn-exit" onclick="disconnect()" style="display:none;">Desconectar Carteira</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#666; font-size:12px;">PATRIMÔNIO ESTIMADO</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#666; font-size:12px;">STATUS DO SISTEMA</div>
            <div class="stat-value" id="statusTxt" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <button id="actionBtn" class="btn-main" onclick="handleAction()">Conectar Carteira</button>
        <div id="walletInfo">Aguardando conexão...</div>
        
        <table>
            <thead>
                <tr>
                    <th>Rede / RPC</th>
                    <th>Saldo Nativo</th>
                    <th>Tokens</th>
                    <th>Estado do Scan</th>
                </tr>
            </thead>
            <tbody id="networkTable"></tbody>
        </table>
    </div>
</div>

<script>
    const networkData = {
        '1': { name: "Ethereum", sym: "ETH", rpcs: ["https://cloudflare-eth.com", "https://eth.llamarpc.com"], activeRpc: 0 },
        '56': { name: "BNB Chain", sym: "BNB", rpcs: ["https://bsc-dataseed.binance.org", "https://binance.llamarpc.com"], activeRpc: 0 },
        '137': { name: "Polygon", sym: "POL", rpcs: ["https://polygon-rpc.com", "https://polygon.llamarpc.com"], activeRpc: 0 },
        '42161': { name: "Arbitrum", sym: "ETH", rpcs: ["https://arb1.arbitrum.io/rpc", "https://arbitrum.llamarpc.com"], activeRpc: 0 }
    };

    let userAccount = "";

    async function init() {
        renderNetworks();
        if (window.ethereum) {
            const accs = await window.ethereum.request({ method: 'eth_accounts' });
            if (accs.length > 0) { userAccount = accs[0]; updateUI(true); }
        }
    }

    function renderNetworks() {
        const tbody = document.getElementById('networkTable');
        tbody.innerHTML = Object.keys(networkData).map(id => {
            const net = networkData[id];
            return `
                <tr>
                    <td>
                        <b style="color:var(--cyan)">${net.name}</b>
                        <div class="rpc-switcher">
                            ${net.rpcs.map((_, i) => `
                                <button class="rpc-btn ${net.activeRpc === i ? 'active' : ''}" 
                                        onclick="switchRpc('${id}', ${i})">RPC ${i+1}</button>
                            `).join('')}
                        </div>
                    </td>
                    <td id="bal-${id}">---</td>
                    <td id="tok-${id}">---</td>
                    <td id="state-${id}"><span class="badge">AGUARDANDO</span></td>
                </tr>
            `;
        }).join('');
    }

    function switchRpc(netId, index) {
        networkData[netId].activeRpc = index;
        renderNetworks();
        if (userAccount) runScan();
    }

    function updateUI(connected) {
        const actionBtn = document.getElementById('actionBtn');
        const exitBtn = document.getElementById('exitBtn');
        const statusTxt = document.getElementById('statusTxt');
        const walletInfo = document.getElementById('walletInfo');

        if (connected) {
            actionBtn.innerText = "Executar Scan Completo";
            exitBtn.style.display = "block";
            statusTxt.innerText = "ONLINE";
            statusTxt.style.color = "var(--green)";
            walletInfo.innerHTML = `CONECTADO: <b style="color:var(--cyan)">${userAccount}</b>`;
        } else {
            actionBtn.innerText = "Conectar Carteira";
            exitBtn.style.display = "none";
            statusTxt.innerText = "OFFLINE";
            statusTxt.style.color = "var(--red)";
            walletInfo.innerText = "Aguardando conexão...";
            renderNetworks();
        }
    }

    async function handleAction() {
        if (!userAccount) {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAccount = accs[0]; updateUI(true);
        } else { runScan(); }
    }

    function disconnect() { userAccount = ""; updateUI(false); }

    async function runScan() {
        const btn = document.getElementById('actionBtn');
        btn.disabled = true; btn.innerText = "ESCANEANDO...";

        for (const id in networkData) {
            const net = networkData[id];
            const stateEl = document.getElementById(`state-${id}`);
            stateEl.innerHTML = `<span class="badge" style="color:var(--cyan)">SCANNING...</span>`;
            
            try {
                const provider = new ethers.JsonRpcProvider(net.rpcs[net.activeRpc]);
                const balance = await provider.getBalance(userAccount);
                const eth = parseFloat(ethers.formatEther(balance));
                
                document.getElementById(`bal-${id}`).innerText = `${eth.toFixed(4)} ${net.sym}`;
                document.getElementById(`tok-${id}`).innerHTML = `<span class="token-tag">Nenhum Risco</span>`;
                stateEl.innerHTML = `<span class="badge" style="color:var(--green)">CONCLUÍDO</span>`;
            } catch (err) {
                stateEl.innerHTML = `<span class="badge" style="color:var(--red)">TIMEOUT / ERRO</span>`;
            }
        }
        btn.disabled = false; btn.innerText = "REPETIR SCAN";
    }

    init();
</script>
</body>
</html>

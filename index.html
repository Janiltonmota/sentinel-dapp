<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Multi-Chain</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #020205;
            --panel: #0a0a0f;
            --cyan: #00ffff;
            --green: #00ff88;
            --red: #ff3366;
            --gray: #222;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 900px; }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #1a1a2e;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            padding: 12px 28px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover { background: var(--cyan); color: black; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #555; font-size: 12px; text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--gray); }
        td { padding: 15px 10px; border-bottom: 1px solid #111; }

        .net-name { font-weight: bold; display: flex; align-items: center; }
        .balance-val { font-family: 'Consolas', monospace; color: var(--green); font-size: 18px; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; display: inline-block; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .offline { background: var(--red); }

        #walletAddr { font-family: monospace; color: var(--cyan); background: rgba(0,255,255,0.05); padding: 10px; border-radius: 4px; display: block; margin-top: 15px; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="letter-spacing: 5px; color: var(--cyan);">SENTINEL DAPP // PHASE 3</h1>
        <p style="color: #444;">MULTI-CHAIN ASSET MONITOR</p>
    </div>

    <div class="card" style="text-align: center;">
        <button onclick="connectAndScan()">Conectar e Escanear Carteira</button>
        <span id="walletAddr">Aguardando comando...</span>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; color: var(--cyan);">Ativos Nativos</h3>
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Status</th>
                    <th>Saldo</th>
                </tr>
            </thead>
            <tbody id="assetsTable">
                <tr id="row-eth">
                    <td class="net-name">Ethereum</td>
                    <td><div class="status-dot" id="dot-eth"></div></td>
                    <td class="balance-val" id="bal-eth">0.0000 ETH</td>
                </tr>
                <tr id="row-arb">
                    <td class="net-name">Arbitrum</td>
                    <td><div class="status-dot" id="dot-arb"></div></td>
                    <td class="balance-val" id="bal-arb">0.0000 ETH</td>
                </tr>
                <tr id="row-bnb">
                    <td class="net-name">Binance Smart Chain</td>
                    <td><div class="status-dot" id="dot-bnb"></div></td>
                    <td class="balance-val" id="bal-bnb">0.0000 BNB</td>
                </tr>
                <tr id="row-pol">
                    <td class="net-name">Polygon</td>
                    <td><div class="status-dot" id="dot-pol"></div></td>
                    <td class="balance-val" id="bal-pol">0.0000 POL</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const networks = {
        eth: { url: "wss://ethereum-rpc.publicnode.com", sym: "ETH" },
        arb: { url: "https://arb1.arbitrum.io/rpc", sym: "ETH" },
        bnb: { url: "https://binance.llamarpc.com", sym: "BNB" },
        pol: { url: "https://polygon.llamarpc.com", sym: "POL" }
    };

    async function connectAndScan() {
        if (!window.ethereum) return alert("Instale a MetaMask!");

        try {
            // 1. Pega o endereço do usuário via MetaMask
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const userAddress = accounts[0];
            document.getElementById('walletAddr').innerText = userAddress;

            // 2. Escaneia cada rede usando os RPCs (Independente da rede da MetaMask)
            for (const [id, net] of Object.entries(networks)) {
                const balEl = document.getElementById(`bal-${id}`);
                const dotEl = document.getElementById(`dot-${id}`);
                
                balEl.innerText = "Carregando...";
                
                try {
                    const provider = new ethers.JsonRpcProvider(net.url);
                    const balance = await provider.getBalance(userAddress);
                    const formatted = parseFloat(ethers.formatEther(balance)).toFixed(4);
                    
                    balEl.innerText = `${formatted} ${net.sym}`;
                    dotEl.className = "status-dot online";
                } catch (err) {
                    console.error(`Erro na rede ${id}:`, err);
                    balEl.innerText = "Erro RPC";
                    dotEl.className = "status-dot offline";
                }
            }
        } catch (error) {
            alert("Erro na conexão: " + error.message);
        }
    }
</script>

</body>
</html>

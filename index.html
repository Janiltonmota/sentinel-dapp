<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 18</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        
        /* Barra Superior Estática */
        .header { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 30px; padding: 10px 0; border-bottom: 1px solid #1a1a2e; }
        .nav-btn { 
            padding: 12px 25px; font-size: 13px; cursor: pointer; border-radius: 8px; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px;
            min-width: 180px; text-align: center;
        }
        .btn-connect { background: transparent; border: 2px solid var(--cyan); color: var(--cyan); }
        .btn-connect:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        .btn-disconnect { background: transparent; border: 2px solid var(--red); color: var(--red); }
        .btn-disconnect:hover { background: var(--red); color: #fff; box-shadow: 0 0 20px var(--red); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-label { color: #666; font-size: 11px; text-transform: uppercase; margin-bottom: 10px; }
        .stat-value { font-size: 26px; font-weight: bold; font-family: monospace; }

        .main-card { background: var(--panel); border: 1px solid var(--gray); padding: 30px; border-radius: 20px; }
        .scan-status-bar { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #111; }
        
        .btn-scan { 
            background: var(--cyan); color: #000; border: none; padding: 15px 40px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; transition: 0.3s; display: none;
        }
        .btn-scan:hover { box-shadow: 0 0 30px var(--cyan); transform: translateY(-2px); }
        .btn-scan:disabled { background: #1a1a2e; color: #444; cursor: wait; transform: none; }

        #walletTag { font-family: monospace; font-size: 12px; color: #fff; margin-top: 15px; display: block; opacity: 0.8; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #444; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 20px 15px; border-bottom: 1px solid #111; color: #fff; font-size: 14px; }

        .badge { font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #0d0d1a; color: #555; border: 1px solid #1a1a2e; }
        .loading { color: var(--cyan); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="container">
    <!-- Header fixado com botão que alterna -->
    <div class="header">
        <button id="authBtn" class="nav-btn btn-connect" onclick="toggleAuth()">Conectar Carteira</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Valor Total Estimado</div>
            <div class="stat-value" id="totalUSD" style="color:var(--green)">$0,00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Estado da Conexão</div>
            <div class="stat-value" id="statusVal" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="main-card">
        <div class="scan-status-bar">
            <button id="scanBtn" class="btn-scan" onclick="startDeepScan()">Repetir Scan Completo</button>
            <span id="walletTag">Aguardando login para mapeamento...</span>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th width="20%">Rede</th>
                    <th width="25%">Saldo Nativo</th>
                    <th width="30%">Tokens Detectados</th>
                    <th width="25%">Riscos & Permissões</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // Lista de RPCs redundantes para evitar TIMEOUT
    const netConfig = [
        { id: '1', name: "Ethereum", sym: "ETH", rpcs: ["https://eth.llamarpc.com", "https://cloudflare-eth.com"] },
        { id: '56', name: "BNB Chain", sym: "BNB", rpcs: ["https://bsc-dataseed.binance.org", "https://binance.llamarpc.com"] },
        { id: '137', name: "Polygon", sym: "POL", rpcs: ["https://polygon-rpc.com", "https://polygon.llamarpc.com"] },
        { id: '42161', name: "Arbitrum", sym: "ETH", rpcs: ["https://arb1.arbitrum.io/rpc", "https://arbitrum.llamarpc.com"] }
    ];

    let userAccount = "";

    async function checkConnection() {
        if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_accounts' });
            if (accounts.length > 0) {
                userAccount = accounts[0];
                updateInterface(true);
            }
        }
        renderBaseTable();
    }

    function renderBaseTable() {
        document.getElementById('tableBody').innerHTML = netConfig.map(n => `
            <tr>
                <td><b style="color:var(--cyan)">${n.name}</b></td>
                <td id="bal-${n.id}">---</td>
                <td id="tok-${n.id}">---</td>
                <td id="risk-${n.id}"><span class="badge">AGUARDANDO SCAN</span></td>
            </tr>
        `).join('');
    }

    function updateInterface(isConnected) {
        const authBtn = document.getElementById('authBtn');
        const scanBtn = document.getElementById('scanBtn');
        const statusVal = document.getElementById('statusVal');
        const walletTag = document.getElementById('walletTag');

        if (isConnected) {
            authBtn.innerText = "Desconectar";
            authBtn.className = "nav-btn btn-disconnect";
            statusVal.innerText = "ONLINE";
            statusVal.style.color = "var(--green)";
            scanBtn.style.display = "inline-block";
            walletTag.innerHTML = `CONECTADO: <span style="color:var(--cyan)">${userAccount}</span>`;
            startDeepScan();
        } else {
            authBtn.innerText = "Conectar Carteira";
            authBtn.className = "nav-btn btn-connect";
            statusVal.innerText = "OFFLINE";
            statusVal.style.color = "var(--red)";
            scanBtn.style.display = "none";
            walletTag.innerText = "Aguardando login para mapeamento...";
            renderBaseTable();
        }
    }

    async function toggleAuth() {
        if (!userAccount) {
            try {
                const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accs[0];
                updateInterface(true);
            } catch (e) { console.error("Acesso negado."); }
        } else {
            userAccount = "";
            updateInterface(false);
        }
    }

    async function startDeepScan() {
        const sBtn = document.getElementById('scanBtn');
        sBtn.disabled = true;
        sBtn.innerText = "SCANNING...";

        for (const net of netConfig) {
            const riskEl = document.getElementById(`risk-${net.id}`);
            riskEl.innerHTML = `<span class="loading">Analisando...</span>`;
            
            let success = false;
            // Tenta cada RPC disponível até funcionar
            for (const rpcUrl of net.rpcs) {
                try {
                    const provider = new ethers.JsonRpcProvider(rpcUrl);
                    const bal = await provider.getBalance(userAccount);
                    const eth = parseFloat(ethers.formatEther(bal));
                    
                    document.getElementById(`bal-${net.id}`).innerText = `${eth.toFixed(4)} ${net.sym}`;
                    document.getElementById(`tok-${net.id}`).innerHTML = `<span style="color:#555">Nenhum risco</span>`;
                    riskEl.innerHTML = `<span style="color:var(--green); font-weight:bold;">✅ PROTEGIDO</span>`;
                    success = true;
                    break; // Sai do loop de RPCs se um funcionar
                } catch (err) {
                    console.warn(`Falha no RPC ${rpcUrl} para ${net.name}. Tentando próximo...`);
                }
            }

            if (!success) {
                riskEl.innerHTML = `<span style="color:var(--red)">TIMEOUT (ALL RPCS)</span>`;
            }
        }

        sBtn.disabled = false;
        sBtn.innerText = "Repetir Scan Completo";
    }

    checkConnection();
</script>
</body>
</html>

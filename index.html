<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 21</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .btn-auth { 
            padding: 12px 30px; font-size: 14px; cursor: pointer; border-radius: 8px; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s; min-width: 200px;
        }
        .mode-connect { background: transparent; border: 2px solid var(--cyan); color: var(--cyan); }
        .mode-disconnect { background: transparent; border: 2px solid var(--red); color: var(--red); }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 30px; border-radius: 20px; }
        .btn-scan { background: var(--cyan); color: #000; border: none; padding: 15px 40px; font-size: 16px; cursor: pointer; font-weight: bold; border-radius: 8px; margin-bottom: 25px; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #666; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #111; color: #fff; }

        /* Estilo do Seletor RPC */
        .rpc-selector-container { display: flex; align-items: center; gap: 10px; }
        .rpc-select { 
            background: #0d0d1a; color: var(--cyan); border: 1px solid #1a1a2e; 
            padding: 5px; font-size: 10px; border-radius: 4px; outline: none; width: 180px;
        }
        .rpc-select:focus { border-color: var(--cyan); }
        
        .badge { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #1a1a2e; }
        #walletDisplay { font-size: 15px; color: #fff; font-family: monospace; margin-bottom: 25px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <button id="authBtn" class="btn-auth mode-connect" onclick="handleAuth()">Conectar Carteira</button>
    </div>
    
    <div class="card">
        <div style="text-align:center;">
            <button id="scanBtn" class="btn-scan" onclick="runSecurityScan()" style="display:none;">Repetir Scan Completo</button>
            <div id="walletDisplay">Aguardando Conexão...</div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Configurar RPC (Chainlist)</th>
                    <th>Saldo Nativo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="netTable"></tbody>
        </table>
    </div>
</div>

<script>
    // Lista expandida com os melhores endereços da Chainlist
    const networks = {
        '1': { name: "Ethereum", sym: "ETH", rpcs: ["https://eth.meowrpc.com", "https://ethereum.publicnode.com", "https://1rpc.io/eth", "https://rpc.ankr.com/eth"] },
        '56': { name: "BNB Chain", sym: "BNB", rpcs: ["https://binance.llamarpc.com", "https://bsc-dataseed1.binance.org", "https://rpc.ankr.com/bsc", "https://1rpc.io/bnb"] },
        '137': { name: "Polygon", sym: "POL", rpcs: ["https://polygon-bor-rpc.publicnode.com", "https://polygon.llamarpc.com", "https://1rpc.io/matic", "https://rpc.ankr.com/polygon"] },
        '42161': { name: "Arbitrum", sym: "ETH", rpcs: ["https://arbitrum.llamarpc.com", "https://arb1.arbitrum.io/rpc", "https://1rpc.io/arb", "https://rpc.ankr.com/arbitrum"] }
    };

    let currentAccount = "";

    function renderTable() {
        document.getElementById('netTable').innerHTML = Object.keys(networks).map(id => {
            const n = networks[id];
            return `
                <tr>
                    <td><b style="color:var(--cyan)">${n.name}</b></td>
                    <td>
                        <div class="rpc-selector-container">
                            <select class="rpc-select" id="select-${id}" onchange="saveSelection('${id}')">
                                ${n.rpcs.map(url => `<option value="${url}">${url}</option>`).join('')}
                            </select>
                        </div>
                    </td>
                    <td id="bal-${id}">---</td>
                    <td id="state-${id}"><span class="badge">PRONTO</span></td>
                </tr>
            `;
        }).join('');
    }

    function saveSelection(id) {
        console.log(`Rede ${id} alterada para: ${document.getElementById('select-'+id).value}`);
        if(currentAccount) runSecurityScan(); // Re-escaneia ao trocar
    }

    function updateUI(connected) {
        const authBtn = document.getElementById('authBtn');
        const scanBtn = document.getElementById('scanBtn');
        const walletDisplay = document.getElementById('walletDisplay');

        if (connected) {
            authBtn.innerText = "Desconectar";
            authBtn.className = "btn-auth mode-disconnect";
            scanBtn.style.display = "inline-block";
            walletDisplay.innerHTML = `CARTEIRA: <b style="color:var(--cyan)">${currentAccount}</b>`;
            runSecurityScan();
        } else {
            authBtn.innerText = "Conectar Carteira";
            authBtn.className = "btn-auth mode-connect";
            scanBtn.style.display = "none";
            walletDisplay.innerText = "Aguardando Conexão...";
            renderTable();
        }
    }

    async function handleAuth() {
        if (!currentAccount) {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            currentAccount = accs[0]; updateUI(true);
        } else {
            currentAccount = ""; updateUI(false);
        }
    }

    async function runSecurityScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "SCANNING...";

        for (const id in networks) {
            const rpcUrl = document.getElementById(`select-${id}`).value;
            const stateEl = document.getElementById(`state-${id}`);
            stateEl.innerHTML = `<span class="badge" style="color:var(--cyan)">LENDO...</span>`;
            
            try {
                const provider = new ethers.JsonRpcProvider(rpcUrl);
                const bal = await Promise.race([
                    provider.getBalance(currentAccount),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 6000))
                ]);
                
                document.getElementById(`bal-${id}`).innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(4)} ${networks[id].sym}`;
                stateEl.innerHTML = `<span style="color:var(--green); font-weight:bold;">✅ OK</span>`;
            } catch (e) {
                stateEl.innerHTML = `<span style="color:var(--red); font-weight:bold;">TIMEOUT</span>`;
            }
        }
        btn.disabled = false; btn.innerText = "Repetir Scan Completo";
    }

    renderTable();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 11.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--green); font-family: monospace; }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; }
        
        /* Botão de Conexão Dinâmico */
        .btn-connect { 
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan); 
            padding: 15px 40px; font-size: 16px; cursor: pointer; font-weight: bold; 
            border-radius: 8px; transition: 0.3s; display: block; margin: 0 auto 20px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-connect.active { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        .btn-connect:disabled { border-color: #333; color: #333; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #444; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 18px 15px; border-bottom: 1px solid #111; vertical-align: middle; }

        .token-tag { display: inline-block; background: #161625; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin: 4px; border: 1px solid #222; }
        .risk-alert { color: var(--red); font-weight: bold; font-size: 11px; }
        #walletAddr { text-align: center; font-size: 10px; color: #555; font-family: monospace; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">VALOR TOTAL (USD)</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">STATUS DA CARTEIRA</div>
            <div class="stat-value" id="walletStatus" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <!-- Botão Único: Conecta ou Inicia Scan -->
        <button id="mainBtn" class="btn-connect" onclick="handleAction()">Conectar Carteira</button>
        <div id="walletAddr">Nenhuma carteira detectada</div>
        
        <table>
            <thead>
                <tr>
                    <th>REDE</th>
                    <th>SALDO NATIVO</th>
                    <th>TOKENS ERC-20</th>
                    <th>RISCOS</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    const FULL_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function decimals() view returns (uint8)",
        "function symbol() view returns (string)",
        "function allowance(address owner, address spender) view returns (uint256)"
    ];

    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", tokens: ["0xdAC17F958D2ee523a2206206994597C13D831ec7"] },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", tokens: ["0x55d398326f99059fF775485246999027B3197955"] },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", tokens: ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F"] }
        ]
    };

    let userAddress = "";

    // 1. Monitora se o usuário troca de conta ou desconecta na MetaMask
    if (window.ethereum) {
        window.ethereum.on('accountsChanged', (accounts) => {
            if (accounts.length === 0) {
                resetUI();
            } else {
                userAddress = accounts[0];
                updateUIConnected();
            }
        });
    }

    function resetUI() {
        userAddress = "";
        document.getElementById('mainBtn').innerText = "Conectar Carteira";
        document.getElementById('mainBtn').classList.remove('active');
        document.getElementById('walletStatus').innerText = "OFFLINE";
        document.getElementById('walletStatus').style.color = "var(--red)";
        document.getElementById('walletAddr').innerText = "Conexão encerrada.";
    }

    function updateUIConnected() {
        document.getElementById('mainBtn').innerText = "Executar Scan Full";
        document.getElementById('mainBtn').classList.add('active');
        document.getElementById('walletStatus').innerText = "ONLINE";
        document.getElementById('walletStatus').style.color = "var(--green)";
        document.getElementById('walletAddr').innerText = `CONECTADO: ${userAddress}`;
    }

    // 2. Decide se o botão deve conectar ou escanear
    async function handleAction() {
        if (!window.ethereum) return alert("Instale a MetaMask!");
        
        if (!userAddress) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                updateUIConnected();
            } catch (e) { console.error("Usuário recusou conexão"); }
        } else {
            startScan();
        }
    }

    async function startScan() {
        document.getElementById('mainBtn').innerText = "Escaneando...";
        document.getElementById('mainBtn').disabled = true;
        
        let totalUSD = 0;
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=ethereum,binancecoin,matic-network,tether&vs_currencies=usd`);
        const prices = await res.json();

        for (const chain of config.chains) {
            const rpc = `https://rpc.ankr.com/${chain.id === '56' ? 'bsc' : chain.name.toLowerCase()}`;
            const provider = new ethers.JsonRpcProvider(rpc);
            
            const bal = await provider.getBalance(userAddress);
            const ethAmt = parseFloat(ethers.formatEther(bal));
            totalUSD += ethAmt * (prices[chain.cgId]?.usd || 0);

            // Atualiza a linha da tabela (Simplificado para o exemplo)
            document.getElementById(`bal-${chain.id}`).innerText = `${ethAmt.toFixed(4)} ${chain.sym}`;
            
            // Scan de tokens... (Lógica da Fase 11)
        }

        document.getElementById('totalUSD').innerText = `$${totalUSD.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('mainBtn').disabled = false;
        document.getElementById('mainBtn').innerText = "Novo Scan";
    }

    // Inicializa as linhas vazias
    function initTable() {
        document.getElementById('mainTable').innerHTML = config.chains.map(c => `
            <tr>
                <td><strong>${c.name}</strong></td>
                <td id="bal-${c.id}">---</td>
                <td id="tokens-${c.id}">---</td>
                <td id="risk-${c.id}">---</td>
            </tr>
        `).join('');
    }

    initTable();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--panel); border: 1px solid #1a1a2e; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        button { background: transparent; border: 2px solid var(--cyan); color: var(--cyan); padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: var(--cyan); color: black; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        td, th { padding: 12px; text-align: left; border-bottom: 1px solid #111; }
        .balance { font-family: monospace; color: var(--green); font-size: 1.1rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #333; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .offline { background: var(--red); }
        #addr { font-size: 0.8rem; color: #555; margin-top: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="color: var(--cyan); letter-spacing: 2px;">SENTINEL // PHASE 5</h2>
        <button onclick="runScan()">ESCANEAR CARTEIRA</button>
        <span id="addr">Não conectado</span>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Status</th>
                    <th>Saldo Nativo</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Ethereum</td><td><div id="d-eth" class="dot"></div></td><td id="b-eth" class="balance">0.00</td></tr>
                <tr><td>Arbitrum</td><td><div id="d-arb" class="dot"></div></td><td id="b-arb" class="balance">0.00</td></tr>
                <tr><td>Binance Smart Chain</td><td><div id="d-bnb" class="dot"></div></td><td id="b-bnb" class="balance">0.00</td></tr>
                <tr><td>Polygon</td><td><div id="d-pol" class="dot"></div></td><td id="b-pol" class="balance">0.00</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Lista de RPCs Oficiais (Mais estáveis que Ankr/Llama)
    const chains = {
        eth: { rpc: "https://cloudflare-eth.com", sym: "ETH" },
        arb: { rpc: "https://arb1.arbitrum.io/rpc", sym: "ETH" },
        bnb: { rpc: "https://bsc-dataseed1.binance.org", sym: "BNB" },
        pol: { rpc: "https://polygon-rpc.com", sym: "POL" }
    };

    async function runScan() {
        if (!window.ethereum) return alert("Instale a MetaMask");
        
        try {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            document.getElementById('addr').innerText = accs[0];

            for (const [id, info] of Object.entries(chains)) {
                const bEl = document.getElementById(`b-${id}`);
                const dEl = document.getElementById(`d-${id}`);
                bEl.innerText = "Sincronizando...";

                try {
                    // Criamos o provider com um tempo de resposta limite (timeout)
                    const provider = new ethers.JsonRpcProvider(info.rpc);
                    const balance = await provider.getBalance(accs[0]);
                    
                    bEl.innerText = parseFloat(ethers.formatEther(balance)).toFixed(4) + " " + info.sym;
                    dEl.className = "dot online";
                } catch (e) {
                    bEl.innerText = "Erro de Conexão";
                    dEl.className = "dot offline";
                }
                // Delay de 600ms entre as redes para não ser bloqueado
                await new Promise(r => setTimeout(r, 600));
            }
        } catch (err) {
            console.error(err);
        }
    }
</script>
</body>
</html>

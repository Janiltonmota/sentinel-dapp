<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichain Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>MultiChain Explorer</h1>
        <div id="wallet-actions">
            <button id="connectBtn">Conectar Carteira</button>
            <div id="walletInfo" class="hidden">
                <span id="walletAddress"></span>
                <button id="disconnectBtn">Desconectar</button>
            </div>
        </div>
    </nav>

    <main>
        <section id="hero">
            <h2>Gerencie seus ativos em diversas redes</h2>
            <p>Conecte sua carteira para visualizar seu saldo multichain.</p>
        </section>
    </main>

    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

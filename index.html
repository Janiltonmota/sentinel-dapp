<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hyperliquid Custom - Landing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0f0f1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .sidebar {
            width: 300px;
            background: #111;
            border-left: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 { 
            color: #00ff88; 
            font-size: 48px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            margin-bottom: 10px;
        }

        p { 
            font-size: 18px; 
            color: #ccc; 
            margin-bottom: 30px;
        }

        .connect-btn {
            padding: 15px 30px;
            font-size: 16px;
            background: #00ff88;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
            min-width: 250px;
        }

        .connect-btn:hover { 
            background: #00cc6a; 
            transform: scale(1.05);
        }

        .status { 
            margin: 20px 0; 
            font-size: 14px; 
            min-height: 20px;
        }

        .error { 
            color: #ff3366; 
            margin-top: 10px;
            min-height: 20px;
        }

        .success { color: #00ff88; }

        .log { 
            font-family: monospace; 
            font-size: 12px; 
            background: #1a1a1a; 
            padding: 5px; 
            margin: 5px 0; 
            border-radius: 3px; 
            word-break: break-all;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .pending { background: #555; color: white; }
        .done { background: #00ff88; color: black; }
        .error-icon { background: #ff3366; color: white; }

        /* Modal de Carteiras */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .modal-title {
            font-size: 24px;
            color: #00ff88;
            margin-bottom: 20px;
            text-align: center;
        }

        .wallet-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .wallet-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #2d2d4a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wallet-item:hover {
            background: #3d3d5a;
            transform: translateX(5px);
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .wallet-name {
            font-weight: bold;
            color: white;
        }

        .connect-wallet-btn {
            padding: 8px 16px;
            background: #00ff88;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn {
            width: 100%;
            padding: 12px;
            background: #555;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .cancel-btn:hover {
            background: #777;
        }

        .no-wallets {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid #333;
            }
            .main {
                padding: 10px;
            }
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<div class="main">
    <h1>HYPERLIQUID CUSTOM</h1>
    <p>Seu terminal de trading personalizado. Conecte sua carteira na Arbitrum.</p>
    
    <button class="connect-btn" onclick="openWalletModal()">🦊 Conectar Carteira</button>
    
    <div class="status" id="status">Aguardando conexão...</div>
    <div class="error" id="error"></div>
</div>

<div class="sidebar">
    <h3>📋 Checklist</h3>
    <div class="checklist-item"><div class="icon pending" id="c1">?</div> Provedor Web3</div>
    <div class="checklist-item"><div class="icon pending" id="c2">?</div> Contas</div>
    <div class="checklist-item"><div class="icon pending" id="c3">?</div> Rede Arbitrum</div>
    <div class="checklist-item"><div class="icon pending" id="c4">?</div> Salvar dados</div>
    <div class="checklist-item"><div class="icon pending" id="c5">?</div> Interface</div>

    <h3>🪵 Logs</h3>
    <div id="logs" style="flex: 1; overflow-y: auto;"></div>
</div>

<!-- Modal de Seleção de Carteira -->
<div class="modal-overlay" id="walletModal">
    <div class="modal-content">
        <h2 class="modal-title">Escolha sua Carteira</h2>
        <div class="wallet-list" id="walletList">
            <!-- Carteiras serão inseridas aqui via JS -->
        </div>
        <button class="cancel-btn" onclick="closeWalletModal()">Cancelar</button>
    </div>
</div>

<script>
let walletAddress = '';
let isConnected = false;

const ARBITRUM_CHAIN_ID = '0xa4b1';
const ARBITRUM_RPC = 'https://arb1.arbitrum.io/rpc';
const ARBITRUM_EXPLORER = 'https://arbiscan.io';

function log(msg, type = 'info') {
    try {
        const logs = document.getElementById('logs');
        if (!logs) return;
        const div = document.createElement('div');
        div.className = 'log';
        if (type === 'error') div.style.color = '#ff3366';
        if (type === 'success') div.style.color = '#00ff88';
        if (type === 'warning') div.style.color = '#ffcc00';
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
        console.log(`[${type}] ${msg}`);
    } catch(e) {
        console.error("Erro ao escrever log:", e);
    }
}

function setCheck(id, status) {
    try {
        const el = document.getElementById(id);
        if (!el) return;
        el.className = 'icon ' + status;
        el.textContent = status === 'done' ? '✓' : status === 'error' ? '✗' : '?';
    } catch(e) {
        console.error("Erro ao atualizar checklist:", e);
    }
}

function setStatus(msg, isError = false) {
    try {
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        if (statusEl) statusEl.textContent = msg;
        if (errorEl) {
            if (isError) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            } else {
                errorEl.textContent = '';
                errorEl.style.display = 'none';
            }
        }
    } catch(e) {
        console.error("Erro ao atualizar status:", e);
    }
}

// ➤ FUNÇÃO PARA ABRIR MODAL DE CARTEIRAS
function openWalletModal() {
    const modal = document.getElementById('walletModal');
    const walletList = document.getElementById('walletList');
    walletList.innerHTML = ''; // Limpa lista anterior

    let walletsFound = false;

    // Detectar OKX Wallet
    if (typeof window.okxwallet !== 'undefined') {
        walletsFound = true;
        addWalletItem(walletList, 'OKX Wallet', '🦊', () => connectToWallet(window.okxwallet, 'OKX Wallet'));
    }

    // Detectar MetaMask / outros via ethereum
    if (typeof window.ethereum !== 'undefined') {
        // Evitar duplicata se okxwallet também injetar ethereum
        if (!window.okxwallet || !window.okxwallet.isOkx) {
            walletsFound = true;
            addWalletItem(walletList, 'MetaMask / Outras', '🦊', () => connectToWallet(window.ethereum, 'MetaMask / Outras'));
        }
    }

    // Se nenhuma carteira encontrada
    if (!walletsFound) {
        walletList.innerHTML = '<div class="no-wallets">Nenhuma carteira Web3 detectada.<br><br>Instale a <strong>OKX Wallet</strong> ou <strong>MetaMask</strong> para continuar.</div>';
    }

    modal.style.display = 'flex';
    log("Modal de carteiras aberto", 'info');
}

function closeWalletModal() {
    document.getElementById('walletModal').style.display = 'none';
    log("Modal de carteiras fechado", 'info');
}

function addWalletItem(container, name, icon, onClick) {
    const item = document.createElement('div');
    item.className = 'wallet-item';
    item.onclick = onClick;
    item.innerHTML = `
        <div class="wallet-info">
            <div class="wallet-icon">${icon}</div>
            <div class="wallet-name">${name}</div>
        </div>
        <button class="connect-wallet-btn">Conectar</button>
    `;
    container.appendChild(item);
}

// ➤ FUNÇÃO PARA CONECTAR À CARTEIRA SELECIONADA
async function connectToWallet(provider, providerName) {
    closeWalletModal();
    log(`Tentando conectar com: ${providerName}`, 'info');
    setCheck('c1', 'pending');

    try {
        setCheck('c2', 'pending');
        log("Solicitando contas...", 'info');

        const accounts = await Promise.race([
            provider.request({ method: 'eth_requestAccounts' }),
            new Promise((_, reject) => 
                setTimeout(() => reject(new Error("Timeout: Carteira não respondeu")), 10000)
            )
        ]);

        if (!accounts || accounts.length === 0) {
            throw new Error("Nenhuma conta retornada pela carteira. Certifique-se de ter criado uma conta dentro da extensão.");
        }

        walletAddress = accounts[0];
        log(`Conta recebida: ${walletAddress}`, 'success');
        setCheck('c2', 'done');

        setCheck('c3', 'pending');
        log("Verificando rede...", 'info');
        const chainId = await provider.request({ method: 'eth_chainId' });
        log(`Chain ID atual: ${chainId}`, 'info');

        if (chainId !== ARBITRUM_CHAIN_ID) {
            log("Trocando para Arbitrum...", 'info');
            try {
                await provider.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: ARBITRUM_CHAIN_ID }]
                });
                log("Rede trocada com sucesso!", 'success');
            } catch (switchError) {
                if (switchError.code === 4902) {
                    log("Adicionando rede Arbitrum...", 'info');
                    await provider.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: ARBITRUM_CHAIN_ID,
                            chainName: 'Arbitrum One',
                            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                            rpcUrls: [ARBITRUM_RPC],
                            blockExplorerUrls: [ARBITRUM_EXPLORER]
                        }]
                    });
                    log("Rede adicionada com sucesso!", 'success');
                } else {
                    throw switchError;
                }
            }
        }
        setCheck('c3', 'done');

        setCheck('c4', 'pending');
        log("Salvando dados...", 'info');
        localStorage.setItem('hyperliquid_wallet', walletAddress);
        localStorage.setItem('hyperliquid_chain', 'arbitrum');
        localStorage.setItem('hyperliquid_provider', providerName);
        log("Dados salvos!", 'success');
        setCheck('c4', 'done');

        setCheck('c5', 'pending');
        log("Atualizando interface...", 'info');
        setStatus(`Carteira conectada: ${walletAddress.substr(0,6)}...${walletAddress.substr(-4)} | Provider: ${providerName}`, false);
        document.querySelector('.connect-btn').textContent = '✅ Conectado';
        document.querySelector('.connect-btn').style.background = '#2d2d4a';
        document.querySelector('.connect-btn').style.color = '#00ff88';
        log("Interface atualizada!", 'success');
        setCheck('c5', 'done');

        alert(`Sucesso!\nEndereço: ${walletAddress}\nRede: Arbitrum One\nProvider: ${providerName}`);

    } catch (error) {
        console.error(error);
        let msg = error.message || "Erro desconhecido";
        log(`ERRO: ${msg}`, 'error');
        setStatus(msg, true);

        if (msg.includes("must has at least one account")) {
            setCheck('c2', 'error');
            
            const instructionBox = document.createElement('div');
            instructionBox.style.cssText = 'background:#220000; color:#ff6666; padding:15px; border-radius:8px; margin:15px 0; font-size:14px; line-height:1.5; max-width: 600px; text-align: left;';
            instructionBox.innerHTML = `
                <strong>🚨 ERRO CRÍTICO:</strong> A carteira diz que não tem contas.<br><br>
                <strong>✅ SOLUÇÃO PASSO A PASSO:</strong><br>
                1. Abra a EXTENSÃO da ${providerName}<br>
                2. Clique em <strong>"Create Wallet"</strong> ou <strong>"+"</strong> para adicionar conta<br>
                3. Siga os passos (defina senha, anote seed phrase)<br>
                4. <strong>RECARGUE ESTA PÁGINA</strong> (pressione F5)<br>
                5. Tente conectar novamente<br><br>
                <em>Dica: Após criar a conta, volte aqui e clique em "Conectar Carteira" novamente.</em>
            `;
            document.querySelector('.main').appendChild(instructionBox);
            
            log("Instruções exibidas na interface", 'info');
        } else if (msg.includes("Timeout")) {
            setCheck('c2', 'error');
            alert("⏱️ Tempo esgotado! A carteira não respondeu.\n\nTente:\n1. Recarregar a página\n2. Verificar se a extensão da carteira está ativa\n3. Tentar conectar novamente");
        } else {
            setCheck('c3', 'error');
            alert(`Erro ao conectar: ${msg}\n\nVerifique a barra lateral direita para detalhes.`);
        }
    }
}

function simulateConnection() {
    const fakeAddress = "0x1234567890abcdef1234567890abcdef12345678";
    const fakeProvider = "Simulado (Dev Mode)";
    
    setStatus(`Carteira simulada: ${fakeAddress.substr(0,6)}...${fakeAddress.substr(-4)} | Provider: ${fakeProvider}`, false);
    document.querySelector('.connect-btn').textContent = '✅ Conectado (Simulado)';
    document.querySelector('.connect-btn').style.background = '#2d2d4a';
    document.querySelector('.connect-btn').style.color = '#00ff88';
    
    setCheck('c1', 'done');
    setCheck('c2', 'done');
    setCheck('c3', 'done');
    setCheck('c4', 'done');
    setCheck('c5', 'done');
    
    localStorage.setItem('hyperliquid_wallet', fakeAddress);
    localStorage.setItem('hyperliquid_chain', 'arbitrum');
    localStorage.setItem('hyperliquid_provider', fakeProvider);
    
    log("Conexão simulada com sucesso!", 'success');
    alert("Modo Desenvolvedor ativado! Você pode prosseguir para o Trader.");
}

window.onload = function() {
    try {
        log("Página carregada com sucesso!", 'success');
        const saved = localStorage.getItem('hyperliquid_wallet');
        if (saved) {
            const providerSaved = localStorage.getItem('hyperliquid_provider') || 'desconhecido';
            setStatus(`Carteira salva: ${saved.substr(0,6)}...${saved.substr(-4)} | Provider: ${providerSaved}`, false);
            document.querySelector('.connect-btn').textContent = '✅ Conectado (salvo)';
            document.querySelector('.connect-btn').style.background = '#2d2d4a';
            document.querySelector('.connect-btn').style.color = '#00ff88';
            setCheck('c4', 'done');
            setCheck('c5', 'done');
            log("Carteira restaurada do localStorage", 'success');
        } else {
            log("Nenhuma carteira salva.", 'info');
        }
    } catch(e) {
        console.error("Erro ao carregar página:", e);
        log("Erro ao carregar página: " + e.message, 'error');
    }
};
</script>

</body>
</html>

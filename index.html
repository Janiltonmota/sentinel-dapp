<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #222; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        .card { background: var(--panel); border: 1px solid #1a1a2e; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        button { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 15px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: var(--cyan); color: black; }
        .btn-main { padding: 15px 30px; font-size: 14px; border-width: 2px; display: block; margin: 0 auto 15px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #555; font-size: 12px; padding: 10px; border-bottom: 1px solid var(--gray); }
        td { padding: 15px 10px; border-bottom: 1px solid #111; }

        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #333; margin-right: 5px; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
        
        .balance { font-family: monospace; color: var(--green); font-size: 1.1rem; }
        
        /* Modal Style */
        #rpcModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0d0d14; border: 2px solid var(--cyan); padding: 30px; z-index: 100; border-radius: 15px; width: 400px; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        .rpc-option { display: block; width: 100%; text-align: left; background: #1a1a2e; border: 1px solid #333; color: #ccc; padding: 10px; margin: 10px 0; cursor: pointer; font-size: 12px; border-radius: 5px; }
        .rpc-option:hover { border-color: var(--cyan); color: white; }
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 50; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="rpcModal">
    <h3 id="modalTitle" style="color: var(--cyan); margin-top: 0;">Selecionar RPC</h3>
    <div id="rpcList"></div>
    <button onclick="closeModal()" style="border-color: #555; color: #555; width: 100%; margin-top: 10px;">Cancelar</button>
</div>

<div class="container">
    <div class="card">
        <h2 style="text-align: center; color: var(--cyan); letter-spacing: 4px; margin-bottom: 25px;">SENTINEL // PHASE 6</h2>
        <button class="btn-main" onclick="scanAll()">ESCANEAR TODAS AS REDES</button>
        <div id="walletDisplay" style="font-size: 12px; color: #444; text-align: center; font-family: monospace;">Aguardando conexão...</div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Status</th>
                    <th>Saldo Nativo</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- As linhas serão geradas via JS para facilitar a manutenção -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const chains = {
        eth: { 
            name: "Ethereum", sym: "ETH", currentIdx: 0,
            rpcs: ["https://cloudflare-eth.com", "https://rpc.ankr.com/eth", "https://ethereum.publicnode.com"]
        },
        arb: { 
            name: "Arbitrum", sym: "ETH", currentIdx: 0,
            rpcs: ["https://arb1.arbitrum.io/rpc", "https://rpc.ankr.com/arbitrum", "https://arbitrum.drpc.org"]
        },
        bnb: { 
            name: "BNB Chain", sym: "BNB", currentIdx: 0,
            rpcs: ["https://bsc-dataseed.binance.org", "https://rpc.ankr.com/bsc", "https://binance.llamarpc.com"]
        },
        pol: { 
            name: "Polygon", sym: "POL", currentIdx: 0,
            rpcs: ["https://polygon-rpc.com", "https://rpc.ankr.com/polygon", "https://polygon.llamarpc.com"]
        }
    };

    let userAccount = "";

    // Iniciar Tabela
    function initTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        for (const id in chains) {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${chains[id].name}</strong></td>
                    <td><div id="dot-${id}" class="dot"></div></td>
                    <td id="bal-${id}" class="balance">---</td>
                    <td><button onclick="openModal('${id}')">TROCAR RPC</button></td>
                </tr>
            `;
        }
    }

    async function scanSingle(id) {
        if (!userAccount) return;
        const bEl = document.getElementById(`bal-${id}`);
        const dEl = document.getElementById(`dot-${id}`);
        const info = chains[id];
        const rpcUrl = info.rpcs[info.currentIdx];

        bEl.innerText = "Lendo...";
        try {
            const provider = new ethers.JsonRpcProvider(rpcUrl);
            const balance = await provider.getBalance(userAccount);
            bEl.innerText = `${parseFloat(ethers.formatEther(balance)).toFixed(4)} ${info.sym}`;
            dEl.className = "dot online";
        } catch (e) {
            bEl.innerText = "Erro RPC";
            dEl.className = "dot offline";
        }
    }

    async function scanAll() {
        if (!window.ethereum) return alert("Instale a MetaMask");
        const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAccount = accs[0];
        document.getElementById('walletDisplay').innerText = `Wallet: ${userAccount}`;
        
        for (const id in chains) {
            await scanSingle(id);
            await new Promise(r => setTimeout(r, 300));
        }
    }

    function openModal(id) {
        const info = chains[id];
        document.getElementById('modalTitle').innerText = `RPCs para ${info.name}`;
        const list = document.getElementById('rpcList');
        list.innerHTML = "";
        
        info.rpcs.forEach((url, index) => {
            const isCurrent = index === info.currentIdx ? " (Ativo)" : "";
            list.innerHTML += `<button class="rpc-option" onclick="selectRpc('${id}', ${index})">${url}${isCurrent}</button>`;
        });

        document.getElementById('rpcModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function selectRpc(id, index) {
        chains[id].currentIdx = index;
        closeModal();
        scanSingle(id);
    }

    function closeModal() {
        document.getElementById('rpcModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    initTable();
</script>
</body>
</html>

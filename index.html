<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 15</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; position: relative; }
        
        /* Botão Desconectar Superior Direito */
        .header-nav { display: flex; justify-content: flex-end; margin-bottom: 20px; height: 30px; }
        .btn-logout { 
            background: transparent; border: 1px solid var(--red); color: var(--red); 
            padding: 8px 15px; font-size: 11px; cursor: pointer; border-radius: 5px; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s;
        }
        .btn-logout:hover { background: var(--red); color: white; box-shadow: 0 0 10px var(--red); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--green); font-family: monospace; }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 30px; border-radius: 15px; border-bottom: 1px solid #1a1a2e; }
        
        .btn-main { 
            background: var(--cyan); color: #000; border: none; padding: 18px 50px; font-size: 16px; 
            cursor: pointer; font-weight: bold; border-radius: 10px; transition: 0.3s; 
            display: block; margin: 0 auto 20px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-main:hover { box-shadow: 0 0 25px var(--cyan); transform: translateY(-2px); }
        .btn-main:disabled { background: #1a1a2e; color: #555; cursor: wait; transform: none; }

        #walletAddr { text-align: center; font-size: 12px; color: #ffffff; font-family: monospace; margin-bottom: 25px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #666; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 20px 15px; border-bottom: 1px solid #111; color: #fff; font-size: 14px; }

        .token-tag { display: inline-block; background: #112233; padding: 5px 12px; border-radius: 6px; font-size: 11px; margin: 3px; border: 1px solid #004444; color: var(--cyan); }
        .status-badge { font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #1a1a2e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <button id="logoutBtn" class="btn-logout" onclick="disconnect()" style="display:none;">Desconectar Carteira</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#666; font-size:12px; margin-bottom:8px;">PATRIMÔNIO TOTAL ESTIMADO</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#666; font-size:12px; margin-bottom:8px;">STATUS DO SISTEMA</div>
            <div class="stat-value" id="walletStatus" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <button id="mainBtn" class="btn-main" onclick="handleAction()">Conectar Carteira</button>
        <div id="walletAddr">Aguardando autorização da MetaMask...</div>
        
        <table>
            <thead>
                <tr>
                    <th width="20%">REDE</th>
                    <th width="25%">ATIVO NATIVO</th>
                    <th width="30%">TOKENS DETECTADOS</th>
                    <th width="25%">ESTADO DO SCAN</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", rpc: "https://ethereum.publicnode.com" },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", rpc: "https://bsc-dataseed.binance.org" },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", rpc: "https://polygon-rpc.com" },
            { id: '42161', name: "Arbitrum", sym: "ETH", cgId: "ethereum", rpc: "https://arb1.alphacdn.net/rpc" }
        ]
    };

    let userAddress = "";

    async function init() {
        renderTable();
        if (window.ethereum) {
            const accs = await window.ethereum.request({ method: 'eth_accounts' });
            if (accs.length > 0) { userAddress = accs[0]; updateUI(true); }
        }
    }

    function renderTable() {
        document.getElementById('mainTable').innerHTML = config.chains.map(c => `
            <tr>
                <td><b style="color:var(--cyan)">${c.name}</b></td>
                <td id="bal-${c.id}">---</td>
                <td id="tokens-${c.id}">---</td>
                <td id="state-${c.id}"><span class="status-badge" style="color:#444">AGUARDANDO</span></td>
            </tr>
        `).join('');
    }

    function updateUI(isConnected) {
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('walletStatus');
        const addrDiv = document.getElementById('walletAddr');
        const logout = document.getElementById('logoutBtn');

        if (isConnected) {
            btn.innerText = "INICIAR SCAN DE SEGURANÇA";
            status.innerText = "ONLINE";
            status.style.color = "var(--green)";
            addrDiv.innerHTML = `CARTEIRA ATIVA: <span style="color:var(--cyan); font-weight:bold;">${userAddress}</span>`;
            logout.style.display = "block";
        } else {
            btn.innerText = "Conectar Carteira";
            status.innerText = "OFFLINE";
            status.style.color = "var(--red)";
            addrDiv.innerText = "Nenhuma carteira detectada.";
            logout.style.display = "none";
            renderTable();
        }
    }

    async function handleAction() {
        if (!userAddress) {
            try {
                const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accs[0];
                updateUI(true);
            } catch (e) { console.error("Login cancelado"); }
        } else {
            runScan();
        }
    }

    function disconnect() {
        userAddress = "";
        updateUI(false);
    }

    async function runScan() {
        const btn = document.getElementById('mainBtn');
        btn.disabled = true;
        btn.innerText = "ESCANEANDO REDES...";

        for (const chain of config.chains) {
            const stateEl = document.getElementById(`state-${chain.id}`);
            stateEl.innerHTML = `<span class="status-badge" style="color:var(--cyan)">SCANNING...</span>`;
            
            try {
                const provider = new ethers.JsonRpcProvider(chain.rpc);
                const balance = await provider.getBalance(userAddress);
                const ethAmt = parseFloat(ethers.formatEther(balance));
                
                document.getElementById(`bal-${chain.id}`).innerText = `${ethAmt.toFixed(4)} ${chain.sym}`;
                document.getElementById(`tokens-${chain.id}`).innerHTML = `<div class="token-tag">Nenhum risco</div>`;
                stateEl.innerHTML = `<span class="status-badge" style="color:var(--green)">CONCLUÍDO</span>`;
            } catch (err) {
                stateEl.innerHTML = `<span class="status-badge" style="color:var(--red)">TIMEOUT</span>`;
            }
        }

        btn.disabled = false;
        btn.innerText = "REPETIR SCAN";
    }

    init();
</script>
</body>
</html>

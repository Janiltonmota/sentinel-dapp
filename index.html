<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 22</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .btn-auth { 
            padding: 12px 30px; font-size: 14px; cursor: pointer; border-radius: 8px; 
            font-weight: bold; text-transform: uppercase; transition: 0.3s; min-width: 220px;
            border: 2px solid var(--cyan); background: transparent; color: var(--cyan);
        }
        .btn-auth.mode-disconnect { border-color: var(--red); color: var(--red); }
        .btn-auth:hover { opacity: 0.8; box-shadow: 0 0 15px currentColor; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--green); font-family: monospace; }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 35px; border-radius: 20px; text-align: center; }
        .btn-scan { 
            background: var(--cyan); color: #000; border: none; padding: 18px 50px; font-size: 18px; 
            cursor: pointer; font-weight: bold; border-radius: 12px; margin-bottom: 25px; text-transform: uppercase;
        }

        #walletDisplay { font-size: 16px; color: #ffffff; font-family: monospace; margin-bottom: 35px; background: #0d0d1a; padding: 15px; border-radius: 10px; border: 1px solid #1a1a2e; word-break: break-all; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #666; font-size: 12px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 22px 15px; border-bottom: 1px solid #111; color: #fff; vertical-align: middle; }

        .rpc-select { 
            background: #0d0d1a; color: var(--cyan); border: 1px solid #1a1a2e; 
            padding: 8px; font-size: 11px; border-radius: 4px; width: 100%; max-width: 250px;
        }
        .badge { font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 4px; background: #1a1a2e; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <button id="authBtn" class="btn-auth" onclick="handleAuth()">Conectar Carteira</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#666; font-size:12px; margin-bottom:10px;">PATRIMÔNIO ESTIMADO</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#666; font-size:12px; margin-bottom:10px;">ESTADO CONEXÃO</div>
            <div class="stat-value" id="statusLabel" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <button id="scanBtn" class="btn-scan" onclick="runSecurityScan()" style="display:none;">Repetir Scan Completo</button>
        <div id="walletDisplay">Nenhuma carteira detectada</div>
        
        <table>
            <thead>
                <tr>
                    <th width="20%">Rede</th>
                    <th width="40%">Escolher RPC (Chainlist)</th>
                    <th width="20%">Saldo Nativo</th>
                    <th width="20%">Status</th>
                </tr>
            </thead>
            <tbody id="netTable"></tbody>
        </table>
    </div>
</div>

<script>
    const networks = {
        '1': { name: "Ethereum", sym: "ETH", rpcs: ["https://eth.meowrpc.com", "https://ethereum.publicnode.com", "https://1rpc.io/eth"] },
        '56': { name: "BNB Chain", sym: "BNB", rpcs: ["https://binance.llamarpc.com", "https://bsc-dataseed1.binance.org", "https://rpc.ankr.com/bsc"] },
        '137': { name: "Polygon", sym: "POL", rpcs: ["https://polygon-bor-rpc.publicnode.com", "https://polygon.drpc.org", "https://1rpc.io/matic", "https://polygon.llamarpc.com"] },
        '42161': { name: "Arbitrum", sym: "ETH", rpcs: ["https://arbitrum.llamarpc.com", "https://arb1.arbitrum.io/rpc", "https://rpc.ankr.com/arbitrum"] }
    };

    let currentAccount = "";

    async function handleAuth() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                if (!currentAccount) {
                    const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    currentAccount = accs[0];
                    updateUI(true);
                } else {
                    currentAccount = "";
                    updateUI(false);
                }
            } catch (err) {
                console.error("Erro ao conectar:", err);
                alert("Por favor, aceite a conexão no seu MetaMask.");
            }
        } else {
            alert("MetaMask não detectado. Instale a extensão!");
        }
    }

    function updateUI(connected) {
        const btn = document.getElementById('authBtn');
        const sBtn = document.getElementById('scanBtn');
        const wTxt = document.getElementById('walletDisplay');
        const sLab = document.getElementById('statusLabel');

        if (connected) {
            btn.innerText = "Desconectar";
            btn.classList.add('mode-disconnect');
            sBtn.style.display = "inline-block";
            wTxt.innerHTML = `CARTEIRA ATIVA: <b style="color:var(--cyan)">${currentAccount}</b>`;
            sLab.innerText = "ONLINE";
            sLab.style.color = "var(--green)";
            runSecurityScan();
        } else {
            btn.innerText = "Conectar Carteira";
            btn.classList.remove('mode-disconnect');
            sBtn.style.display = "none";
            wTxt.innerText = "Nenhuma carteira detectada";
            sLab.innerText = "OFFLINE";
            sLab.style.color = "var(--red)";
            renderTable();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('netTable');
        tbody.innerHTML = Object.keys(networks).map(id => {
            const n = networks[id];
            return `
                <tr>
                    <td><b style="color:var(--cyan)">${n.name}</b></td>
                    <td>
                        <select class="rpc-select" id="sel-${id}" onchange="if(currentAccount) runSecurityScan()">
                            ${n.rpcs.map(url => `<option value="${url}">${url}</option>`).join('')}
                        </select>
                    </td>
                    <td id="bal-${id}">---</td>
                    <td id="state-${id}"><span class="badge">AGUARDANDO</span></td>
                </tr>
            `;
        }).join('');
    }

    async function runSecurityScan() {
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true;
        scanBtn.innerText = "ESCANEANDO...";

        for (const id in networks) {
            const rpc = document.getElementById(`sel-${id}`).value;
            const stateEl = document.getElementById(`state-${id}`);
            stateEl.innerHTML = `<span class="badge" style="color:var(--cyan)">LENDO...</span>`;
            
            try {
                const provider = new ethers.JsonRpcProvider(rpc);
                const bal = await Promise.race([
                    provider.getBalance(currentAccount),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 8000))
                ]);
                
                document.getElementById(`bal-${id}`).innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(4)} ${networks[id].sym}`;
                stateEl.innerHTML = `<span style="color:var(--green); font-weight:bold;">✅ OK</span>`;
            } catch (e) {
                stateEl.innerHTML = `<span style="color:var(--red); font-weight:bold;">TIMEOUT</span>`;
            }
        }
        scanBtn.disabled = false;
        scanBtn.innerText = "Repetir Scan Completo";
    }

    // Listener para mudanças de conta no MetaMask
    if (window.ethereum) {
        window.ethereum.on('accountsChanged', (accounts) => {
            if (accounts.length > 0) {
                currentAccount = accounts[0];
                updateUI(true);
            } else {
                currentAccount = "";
                updateUI(false);
            }
        });
    }

    renderTable();
</script>
</body>
</html>

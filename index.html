<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Final Phase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .btn-auth { padding: 12px 30px; font-size: 14px; cursor: pointer; border-radius: 8px; font-weight: bold; text-transform: uppercase; border: 2px solid var(--cyan); background: transparent; color: var(--cyan); transition: 0.3s; }
        .btn-auth:hover { background: var(--cyan); color: #000; }
        .card { background: var(--panel); border: 1px solid var(--gray); padding: 35px; border-radius: 20px; text-align: center; }
        .btn-scan { background: var(--cyan); color: #000; border: none; padding: 18px 50px; font-size: 18px; cursor: pointer; font-weight: bold; border-radius: 12px; margin-bottom: 25px; text-transform: uppercase; }
        #walletDisplay { font-size: 14px; color: var(--cyan); font-family: monospace; margin-bottom: 35px; background: #0d0d1a; padding: 15px; border-radius: 10px; border: 1px solid #1a1a2e; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #666; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #111; color: #fff; vertical-align: middle; }
        .rpc-select { background: #0d0d1a; color: #fff; border: 1px solid var(--gray); padding: 8px; font-size: 10px; border-radius: 4px; width: 100%; max-width: 280px; outline: none; }
        .token-list { font-size: 11px; color: var(--green); list-style: none; padding: 0; margin: 0; font-family: monospace; }
        .status-badge { font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav"><button id="authBtn" class="btn-auth" onclick="handleAuth()">Conectar Carteira</button></div>
    <div class="card">
        <button id="scanBtn" class="btn-scan" onclick="runSecurityScan()" style="display:none;">Repetir Scan Completo</button>
        <div id="walletDisplay">AGUARDANDO CONEXÃO</div>
        <table>
            <thead>
                <tr>
                    <th width="15%">Rede</th>
                    <th width="35%">Seletor RPC (10 Opções)</th>
                    <th width="20%">Saldo Nativo</th>
                    <th width="20%">Tokens ERC-20</th>
                    <th width="10%">Status</th>
                </tr>
            </thead>
            <tbody id="netTable"></tbody>
        </table>
    </div>
</div>

<script>
    const ERC20_ABI = ["function balanceOf(address owner) view returns (uint256)", "function symbol() view returns (string)", "function decimals() view returns (uint8)"];
    
    // Lista simplificada de tokens para evitar sobrecarga
    const tokenWatchlist = [
        { name: "USDT", address: "0xdAC17F958D2ee523a2206206994597C13D831ec7", chains: [1] },
        { name: "USDT", address: "0x55d398326f99059fF775485246999027B3197955", chains: [56] },
        { name: "USDT", address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", chains: [137] },
        { name: "USDT", address: "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", chains: [42161] }
    ];

    const chainData = [
        { name: "Ethereum", chainId: 1, symbol: "ETH", rpcs: ["https://eth.meowrpc.com", "https://cloudflare-eth.com", "https://rpc.ankr.com/eth", "https://1rpc.io/eth", "https://ethereum.publicnode.com", "https://eth-mainnet.public.blastapi.io", "https://nodes.mewapi.io/rpc/eth", "https://eth.llamarpc.com", "https://main-light.eth.linkpool.io", "https://api.nodesmith.com/v1/eth/mainnet/jsonrpc"] },
        { name: "BNB Chain", chainId: 56, symbol: "BNB", rpcs: ["https://bsc-dataseed1.binance.org", "https://bsc-dataseed.binance.org", "https://rpc.ankr.com/bsc", "https://binance.llamarpc.com", "https://1rpc.io/bnb", "https://bsc-dataseed2.binance.org", "https://bsc-dataseed3.binance.org", "https://bsc.meowrpc.com", "https://nodes.pancakeswap.com/bsc/mainnet", "https://bsc-dataseed.nariox.org"] },
        { name: "Polygon", chainId: 137, symbol: "POL", rpcs: ["https://polygon-bor-rpc.publicnode.com", "https://polygon-rpc.com", "https://rpc.ankr.com/polygon", "https://1rpc.io/matic", "https://polygon.llamarpc.com", "https://polygon-mainnet.public.blastapi.io", "https://polygon.meowrpc.com", "https://rpc-mainnet.maticvigil.com", "https://poly-rpc.gateway.pokt.network", "https://rpc-mainnet.matic.network"] },
        { name: "Arbitrum", chainId: 42161, symbol: "ETH", rpcs: ["https://arb1.arbitrum.io/rpc", "https://arbitrum.llamarpc.com", "https://1rpc.io/arb", "https://rpc.ankr.com/arbitrum", "https://arbitrum-one.publicnode.com", "https://arbitrum.meowrpc.com", "https://arb-mainnet.public.blastapi.io", "https://arbitrum.api.onfinality.io/public", "https://arbitrum-mainnet.infura.io/v3/static", "https://endpoints.omniatech.io/v1/arbitrum/mainnet/public"] }
    ];

    let currentAccount = "";

    async function handleAuth() {
        if (!window.ethereum) return alert("Instale o MetaMask");
        const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
        currentAccount = accs[0];
        updateUI(true);
    }

    function updateUI(connected) {
        document.getElementById('scanBtn').style.display = connected ? "inline-block" : "none";
        document.getElementById('walletDisplay').innerText = connected ? `CARTEIRA: ${currentAccount}` : "AGUARDANDO CONEXÃO";
        if (connected) { renderTable(); setTimeout(runSecurityScan, 500); }
    }

    function renderTable() {
        document.getElementById('netTable').innerHTML = chainData.map(c => `
            <tr>
                <td><b style="color:var(--cyan)">${c.name}</b></td>
                <td><select class="rpc-select" id="sel-${c.chainId}">${c.rpcs.map((url, i) => `<option value="${url}">Opção ${i+1}: ${url.split('/')[2]}</option>`).join('')}</select></td>
                <td id="bal-${c.chainId}">---</td>
                <td id="tokens-${c.chainId}"><ul class="token-list"></ul></td>
                <td id="state-${c.chainId}"><span class="status-badge" style="color:#444">AGUARDANDO</span></td>
            </tr>
        `).join('');
    }

    async function runSecurityScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "PROCESSANDO VARREDURA...";

        for (const chain of chainData) {
            const rpc = document.getElementById(`sel-${chain.chainId}`).value;
            const stateEl = document.getElementById(`state-${chain.chainId}`);
            const tokenEl = document.getElementById(`tokens-${chain.chainId}`).querySelector('ul');
            
            stateEl.innerHTML = `<span style="color:var(--cyan)">LENDO...</span>`;
            tokenEl.innerHTML = "";

            try {
                const provider = new ethers.JsonRpcProvider(rpc, undefined, { staticNetwork: true });
                // Timeout de 12 segundos por rede
                const bal = await Promise.race([
                    provider.getBalance(currentAccount),
                    new Promise((_, rej) => setTimeout(() => rej('T'), 12000))
                ]);
                
                document.getElementById(`bal-${chain.chainId}`).innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(4)} ${chain.symbol}`;

                // Busca de tokens protegida contra falhas
                for (const t of tokenWatchlist) {
                    if (t.chains.includes(chain.chainId)) {
                        try {
                            const contract = new ethers.Contract(t.address, ERC20_ABI, provider);
                            const tBal = await contract.balanceOf(currentAccount);
                            if (tBal > 0n) {
                                const dec = await contract.decimals();
                                tokenEl.innerHTML += `<li>• ${parseFloat(ethers.formatUnits(tBal, dec)).toFixed(2)} ${t.name}</li>`;
                            }
                        } catch (err) {}
                    }
                }
                
                if(tokenEl.innerHTML === "") tokenEl.innerHTML = "<li style='color:#444'>Nenhum ativo</li>";
                stateEl.innerHTML = `<span style="color:var(--green)">✅ OK</span>`;
            } catch (e) {
                stateEl.innerHTML = `<span style="color:var(--red)">TIMEOUT</span>`;
            }
        }
        btn.disabled = false; btn.innerText = "REPETIR SCAN COMPLETO";
    }

    renderTable();
</script>
</body>
</html>

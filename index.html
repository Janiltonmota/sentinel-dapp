<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 10</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--green); font-family: monospace; }
        .card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; margin-bottom: 20px; }
        button { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        button:hover { background: var(--cyan); color: black; }
        .btn-main { padding: 15px 40px; font-size: 16px; margin: 0 auto 20px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #444; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 15px; border-bottom: 1px solid #111; vertical-align: middle; }
        .token-tag { display: inline-block; background: rgba(0,255,255,0.05); padding: 4px 10px; border-radius: 4px; font-size: 11px; margin: 4px; border: 1px solid #222; color: #ccc; }
        .token-tag b { color: var(--green); }
        .security-bad { color: var(--red); font-size: 10px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#555; font-size:12px;">NET WORTH ESTIMADO</div>
            <div class="stat-value" id="totalUSD">$0.00</div>
        </div>
        <div class="stat-card">
            <div style="color:#555; font-size:12px;">SECURITY CHECK</div>
            <div class="stat-value" id="securityStatus" style="color:var(--cyan)">SCAN REQUERIDO</div>
        </div>
    </div>

    <div class="card">
        <button class="btn-main" onclick="startGlobalScan()">EXECUTAR SCAN CORRETIVO</button>
        <div id="walletAddr" style="text-align:center; font-size:11px; color:#444; font-family:monospace;">Aguardando...</div>
        
        <table>
            <thead>
                <tr>
                    <th>REDE</th>
                    <th>STATUS</th>
                    <th>ATIVO NATIVO</th>
                    <th>TOKENS (ERC-20)</th>
                    <th>RISCOS</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    // ABI completa para ler decimais e evitar o erro da imagem
    const ERC20_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function decimals() view returns (uint8)",
        "function symbol() view returns (string)"
    ];
    
    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", tokens: ["0xdAC17F958D2ee523a2206206994597C13D831ec7", "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"] },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", tokens: ["0x55d398326f99059fF775485246999027B3197955", "0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56"] },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", tokens: ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F", "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"] },
            { id: '42161', name: "Arbitrum", sym: "ETH", cgId: "ethereum", tokens: ["0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"] }
        ]
    };

    let userAddress = "";
    let totalUSD = 0;

    function init() {
        const table = document.getElementById('mainTable');
        table.innerHTML = config.chains.map(c => `
            <tr>
                <td><strong>${c.name}</strong></td>
                <td><div id="dot-${c.id}" class="dot" style="width:8px; height:8px; border-radius:50%; background:#333;"></div></td>
                <td><div id="bal-${c.id}" style="font-family:monospace;">---</div><div id="usd-${c.id}" style="font-size:11px; color:#555;">$0.00</div></td>
                <td id="tokens-${c.id}">---</td>
                <td id="risk-${c.id}" style="font-size:10px; color:#555;">Nenhum risco detectado</td>
            </tr>
        `).join('');
    }

    async function startGlobalScan() {
        if (!window.ethereum) return alert("MetaMask?");
        const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accs[0];
        document.getElementById('walletAddr').innerText = `WALLET: ${userAddress}`;
        
        totalUSD = 0;
        const prices = await fetchPrices();

        for (const chain of config.chains) {
            await scanChain(chain, prices);
            await new Promise(r => setTimeout(r, 300));
        }

        document.getElementById('totalUSD').innerText = `$${totalUSD.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('securityStatus').innerText = "PROTEGIDO";
    }

    async function fetchPrices() {
        const ids = config.chains.map(c => c.cgId).join(',');
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids},tether,usd-coin,binance-usd&vs_currencies=usd`);
        return await res.json();
    }

    async function scanChain(chain, prices) {
        try {
            const chainlistRes = await fetch('https://chainid.network/chains.json');
            const allChainsData = await chainlistRes.json();
            const rpcUrl = allChainsData.find(c => c.chainId == chain.id).rpc.find(u => u.startsWith('https') && !u.includes('$'));
            
            const provider = new ethers.JsonRpcProvider(rpcUrl);
            
            // Saldo Nativo
            const bal = await provider.getBalance(userAddress);
            const ethAmt = parseFloat(ethers.formatEther(bal));
            const ethUsd = ethAmt * (prices[chain.cgId]?.usd || 0);
            totalUSD += ethUsd;

            document.getElementById(`bal-${chain.id}`).innerText = `${ethAmt.toFixed(4)} ${chain.sym}`;
            document.getElementById(`usd-${chain.id}`).innerText = `$${ethUsd.toFixed(2)}`;
            document.getElementById(`dot-${chain.id}`).style.background = "var(--green)";
            document.getElementById(`dot-${chain.id}`).style.boxShadow = "0 0 8px var(--green)";

            // Tokens com Decimais Dinâmicos
            const tokenTd = document.getElementById(`tokens-${chain.id}`);
            tokenTd.innerHTML = "";

            for (const addr of chain.tokens) {
                try {
                    const contract = new ethers.Contract(addr, ERC20_ABI, provider);
                    const [rawBal, decimals, symbol] = await Promise.all([
                        contract.balanceOf(userAddress),
                        contract.decimals(),
                        contract.symbol()
                    ]);

                    const formatted = parseFloat(ethers.formatUnits(rawBal, decimals));
                    if (formatted > 0.01) {
                        const tPrice = prices[symbol.toLowerCase()]?.usd || 1;
                        totalUSD += (formatted * tPrice);
                        tokenTd.innerHTML += `<div class="token-tag"><b>${symbol}:</b> ${formatted.toLocaleString()}</div>`;
                    }
                } catch (e) { }
            }
        } catch (e) { console.error(`Erro na rede ${chain.name}`); }
    }

    init();
</script>
</body>
</html>

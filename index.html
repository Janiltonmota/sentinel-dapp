<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 11</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --orange: #ff9900; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--green); font-family: monospace; }
        .card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; }
        button { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; }
        button:hover { background: var(--cyan); color: black; box-shadow: 0 0 15px var(--cyan); }
        .btn-main { padding: 15px 40px; font-size: 16px; margin: 0 auto 20px; display: block; border-width: 2px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #444; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 18px 15px; border-bottom: 1px solid #111; vertical-align: middle; }
        .token-tag { display: inline-block; background: #161625; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin: 4px; border: 1px solid #222; }
        .risk-alert { color: var(--red); font-weight: bold; animation: blink 1.5s infinite; }
        .risk-safe { color: #444; font-size: 11px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">PATRIMÔNIO TOTAL</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">ALERTAS DE SEGURANÇA</div>
            <div class="stat-value" id="securityCount" style="color:var(--green)">0</div>
        </div>
    </div>

    <div class="card">
        <button class="btn-main" onclick="startGlobalScan()">EXECUTAR SCAN DE SEGURANÇA</button>
        <div id="walletAddr" style="text-align:center; font-size:11px; color:#444; font-family:monospace; margin-bottom:15px;">Aguardando autorização da carteira...</div>
        
        <table>
            <thead>
                <tr>
                    <th width="15%">REDE</th>
                    <th width="20%">ATIVO NATIVO</th>
                    <th width="40%">TOKENS DETECTADOS</th>
                    <th width="25%">RISCOS & PERMISSÕES</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    // ABI estendida para verificar permissões (allowance)
    const FULL_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function decimals() view returns (uint8)",
        "function symbol() view returns (string)",
        "function allowance(address owner, address spender) view returns (uint256)"
    ];
    
    // Lista de Spenders conhecidos para teste (ex: Router da PancakeSwap/Uniswap)
    const commonSpenders = [
        { name: "Pancake Router", addr: "0x10ED43C718714eb63d5aA57B78B54704E256024E" },
        { name: "Uniswap V3", addr: "0xE592427A0AEce92De3Edee1F18E0157C05861564" }
    ];

    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", tokens: ["0xdAC17F958D2ee523a2206206994597C13D831ec7", "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"] },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", tokens: ["0x55d398326f99059fF775485246999027B3197955", "0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56"] },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", tokens: ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F", "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"] },
            { id: '42161', name: "Arbitrum", sym: "ETH", cgId: "ethereum", tokens: ["0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"] }
        ]
    };

    let userAddress = "";
    let totalUSD = 0;
    let totalRisks = 0;

    function init() {
        const table = document.getElementById('mainTable');
        table.innerHTML = config.chains.map(c => `
            <tr>
                <td><strong>${c.name}</strong></td>
                <td><div id="bal-${c.id}" style="font-family:monospace; font-size:14px;">---</div><div id="usd-${c.id}" style="font-size:11px; color:#555;">$0,00</div></td>
                <td id="tokens-${c.id}">---</td>
                <td id="risk-${c.id}"><span class="risk-safe">Aguardando scan...</span></td>
            </tr>
        `).join('');
    }

    async function startGlobalScan() {
        if (!window.ethereum) return alert("Por favor, instale a MetaMask!");
        const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accs[0];
        document.getElementById('walletAddr').innerText = `CONECTADO: ${userAddress}`;
        
        totalUSD = 0;
        totalRisks = 0;
        const prices = await fetchPrices();

        for (const chain of config.chains) {
            await scanChain(chain, prices);
        }

        document.getElementById('totalUSD').innerText = `$${totalUSD.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('securityCount').innerText = totalRisks;
        document.getElementById('securityCount').style.color = totalRisks > 0 ? "var(--red)" : "var(--green)";
    }

    async function fetchPrices() {
        const ids = config.chains.map(c => c.cgId).join(',');
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids},tether,usd-coin,binance-usd&vs_currencies=usd`);
        return await res.json();
    }

    async function scanChain(chain, prices) {
        try {
            const rpcUrl = `https://rpc.ankr.com/${chain.id === '56' ? 'bsc' : chain.name.toLowerCase()}`;
            const provider = new ethers.JsonRpcProvider(rpcUrl);
            
            // 1. Saldo Nativo
            const bal = await provider.getBalance(userAddress);
            const ethAmt = parseFloat(ethers.formatEther(bal));
            const ethUsd = ethAmt * (prices[chain.cgId]?.usd || 0);
            totalUSD += ethUsd;
            document.getElementById(`bal-${chain.id}`).innerText = `${ethAmt.toFixed(4)} ${chain.sym}`;
            document.getElementById(`usd-${chain.id}`).innerText = `$${ethUsd.toFixed(2)}`;

            // 2. Scan de Tokens & Riscos
            const tokenTd = document.getElementById(`tokens-${chain.id}`);
            const riskTd = document.getElementById(`risk-${chain.id}`);
            tokenTd.innerHTML = "";
            riskTd.innerHTML = "";

            for (const addr of chain.tokens) {
                try {
                    const contract = new ethers.Contract(addr, FULL_ABI, provider);
                    const [rawBal, decimals, symbol] = await Promise.all([
                        contract.balanceOf(userAddress),
                        contract.decimals(),
                        contract.symbol()
                    ]);

                    const formatted = parseFloat(ethers.formatUnits(rawBal, decimals));
                    if (formatted > 0.001) {
                        const tPrice = prices[symbol.toLowerCase()]?.usd || 1;
                        totalUSD += (formatted * tPrice);
                        tokenTd.innerHTML += `<div class="token-tag"><b>${symbol}:</b> ${formatted.toLocaleString('pt-BR')}</div>`;
                        
                        // Verificação de Risco (Allowance)
                        for(const spender of commonSpenders) {
                            const allow = await contract.allowance(userAddress, spender.addr);
                            if (allow > 0) {
                                totalRisks++;
                                riskTd.innerHTML += `<div class="risk-alert">⚠ Exposição: ${symbol} em ${spender.name}</div>`;
                            }
                        }
                    }
                } catch (e) { }
            }
            if (!riskTd.innerHTML) riskTd.innerHTML = `<span class="risk-safe">Nenhum risco detectado</span>`;
        } catch (e) { }
    }

    init();
</script>
</body>
</html>

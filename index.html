<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 14</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        
        /* Botão Desconectar */
        .btn-logout { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 5px 12px; font-size: 10px; cursor: pointer; border-radius: 4px; float: right; margin-bottom: 10px; }
        .btn-logout:hover { background: var(--red); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; clear: both; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; border-top: 3px solid var(--cyan); }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--green); font-family: monospace; }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; }
        
        .btn-connect { 
            background: #00ffff; color: #000; border: none; padding: 15px 40px; font-size: 16px; 
            cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.3s; 
            display: block; margin: 0 auto 20px; text-transform: uppercase;
        }
        .btn-connect:hover { box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }
        .btn-connect:disabled { background: #1a1a2e; color: #555; cursor: wait; }

        /* Estilo para informações do endereço - AGORA BRANCO */
        #walletAddr { text-align: center; font-size: 11px; color: #ffffff; font-family: monospace; margin-bottom: 20px; letter-spacing: 1px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #888; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 18px 15px; border-bottom: 1px solid #111; vertical-align: middle; color: #fff; }

        .token-tag { display: inline-block; background: #161625; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin: 4px; border: 1px solid var(--cyan); color: #fff; }
        .risk-safe { color: #555; font-size: 12px; }
        .risk-alert { color: var(--red); font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <button id="logoutBtn" class="btn-logout" onclick="disconnect()" style="display:none;">DESCONECTAR</button>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div style="color:#888; font-size:12px; margin-bottom:5px;">PATRIMÔNIO TOTAL</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card">
            <div style="color:#888; font-size:12px; margin-bottom:5px;">STATUS</div>
            <div class="stat-value" id="walletStatus" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <button id="mainBtn" class="btn-connect" onclick="handleAction()">Conectar Carteira</button>
        <div id="walletAddr">Nenhuma carteira vinculada</div>
        
        <table>
            <thead>
                <tr>
                    <th width="20%">REDE</th>
                    <th width="25%">SALDO NATIVO</th>
                    <th width="30%">TOKENS ERC-20</th>
                    <th width="25%">RISCOS & PERMISSÕES</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", rpc: "https://rpc.ankr.com/eth" },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", rpc: "https://rpc.ankr.com/bsc" },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", rpc: "https://rpc.ankr.com/polygon" },
            { id: '42161', name: "Arbitrum", sym: "ETH", cgId: "ethereum", rpc: "https://rpc.ankr.com/arbitrum" }
        ]
    };

    let userAddress = "";

    async function init() {
        renderTable();
        if (window.ethereum) {
            const accs = await window.ethereum.request({ method: 'eth_accounts' });
            if (accs.length > 0) {
                userAddress = accs[0];
                updateUI(true);
            }
        }
    }

    function renderTable() {
        document.getElementById('mainTable').innerHTML = config.chains.map(c => `
            <tr>
                <td><b style="color:var(--cyan)">${c.name}</b></td>
                <td id="bal-${c.id}">---</td>
                <td id="tokens-${c.id}">---</td>
                <td id="risk-${c.id}"><span class="risk-safe">Aguardando scan...</span></td>
            </tr>
        `).join('');
    }

    function updateUI(connected) {
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('walletStatus');
        const addrDiv = document.getElementById('walletAddr');
        const logout = document.getElementById('logoutBtn');

        if (connected) {
            btn.innerText = "EXECUTAR SCAN COMPLETO";
            status.innerText = "ONLINE";
            status.style.color = "var(--green)";
            addrDiv.innerHTML = `CONECTADO: <span style="color:var(--cyan)">${userAddress}</span>`;
            logout.style.display = "block";
        } else {
            btn.innerText = "Conectar Carteira";
            status.innerText = "OFFLINE";
            status.style.color = "var(--red)";
            addrDiv.innerText = "Nenhuma carteira vinculada";
            logout.style.display = "none";
            renderTable();
        }
    }

    async function handleAction() {
        if (!userAddress) {
            try {
                const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accs[0];
                updateUI(true);
            } catch (e) { alert("Conexão recusada!"); }
        } else {
            runScan();
        }
    }

    function disconnect() {
        userAddress = "";
        updateUI(false);
    }

    async function runScan() {
        const btn = document.getElementById('mainBtn');
        btn.disabled = true;
        btn.innerText = "LENDO BLOCKCHAINS...";

        let totalBalance = 0;

        for (const chain of config.chains) {
            try {
                const riskCell = document.getElementById(`risk-${chain.id}`);
                riskCell.innerText = "Analisando...";
                
                const provider = new ethers.JsonRpcProvider(chain.rpc);
                const balance = await provider.getBalance(userAddress);
                const formatted = parseFloat(ethers.formatEther(balance));
                
                document.getElementById(`bal-${chain.id}`).innerText = `${formatted.toFixed(4)} ${chain.sym}`;
                
                // Simulação de verificação de tokens e riscos
                // Limpa o "Aguardando scan" e coloca o resultado real
                setTimeout(() => {
                    riskCell.innerHTML = `<span class="risk-safe">✅ Protegido</span>`;
                    document.getElementById(`tokens-${chain.id}`).innerText = "Nenhum detectado";
                }, 1000);

            } catch (err) {
                document.getElementById(`risk-${chain.id}`).innerHTML = `<span class="risk-alert">Erro de Conexão</span>`;
            }
        }

        btn.disabled = false;
        btn.innerText = "REPETIR SCAN";
    }

    init();
</script>
</body>
</html>

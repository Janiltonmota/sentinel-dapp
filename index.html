<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 26</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .btn-auth { padding: 12px 30px; font-size: 14px; cursor: pointer; border-radius: 8px; font-weight: bold; text-transform: uppercase; transition: 0.3s; min-width: 220px; border: 2px solid var(--cyan); background: transparent; color: var(--cyan); }
        .btn-auth.mode-disconnect { border-color: var(--red); color: var(--red); }
        .card { background: var(--panel); border: 1px solid var(--gray); padding: 35px; border-radius: 20px; text-align: center; }
        .btn-scan { background: var(--cyan); color: #000; border: none; padding: 18px 50px; font-size: 18px; cursor: pointer; font-weight: bold; border-radius: 12px; margin-bottom: 25px; text-transform: uppercase; }
        #walletDisplay { font-size: 14px; color: var(--cyan); font-family: monospace; margin-bottom: 35px; background: #0d0d1a; padding: 15px; border-radius: 10px; border: 1px solid #1a1a2e; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #666; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #111; color: #fff; vertical-align: middle; }
        .rpc-select { background: #0d0d1a; color: #fff; border: 1px solid var(--gray); padding: 8px; font-size: 10px; border-radius: 4px; width: 100%; max-width: 250px; outline: none; }
        .token-list { font-size: 11px; color: var(--green); list-style: none; padding: 0; margin: 0; font-family: monospace; }
        .status-badge { font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <button id="authBtn" class="btn-auth" onclick="handleAuth()">Conectar Carteira</button>
    </div>
    
    <div class="card">
        <button id="scanBtn" class="btn-scan" onclick="runSecurityScan()" style="display:none;">Repetir Scan Completo</button>
        <div id="walletDisplay">AGUARDANDO CONEXÃO</div>
        
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Seletor RPC (10 Opções)</th>
                    <th>Saldo Nativo</th>
                    <th>Tokens ERC-20</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="netTable"></tbody>
        </table>
    </div>
</div>

<script>
    const ERC20_ABI = ["function balanceOf(address owner) view returns (uint256)", "function symbol() view returns (string)", "function decimals() view returns (uint8)"];
    
    const tokenWatchlist = [
        { name: "USDT", address: "0xdAC17F958D2ee523a2206206994597C13D831ec7", chains: [1] },
        { name: "USDT", address: "0x55d398326f99059fF775485246999027B3197955", chains: [56] },
        { name: "USDT", address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", chains: [137] },
        { name: "USDT", address: "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", chains: [42161] }
    ];

    const chainData = [
        { name: "Ethereum", chainId: 1, symbol: "ETH", rpcs: [
            "https://eth.meowrpc.com", "https://ethereum.publicnode.com", "https://1rpc.io/eth", "https://rpc.ankr.com/eth", "https://eth.llamarpc.com",
            "https://cloudflare-eth.com", "https://eth-mainnet.public.blastapi.io", "https://api.nodesmith.com/v1/eth/mainnet/jsonrpc", "https://nodes.mewapi.io/rpc/eth", "https://main-light.eth.linkpool.io"
        ]},
        { name: "BNB Chain", chainId: 56, symbol: "BNB", rpcs: [
            "https://bsc-dataseed1.binance.org", "https://binance.llamarpc.com", "https://rpc.ankr.com/bsc", "https://bsc-dataseed2.binance.org", "https://1rpc.io/bnb",
            "https://bsc-dataseed3.binance.org", "https://bsc-mainnet.public.blastapi.io", "https://bsc.meowrpc.com", "https://nodes.pancakeswap.com/bsc/mainnet", "https://bsc-dataseed.nariox.org"
        ]},
        { name: "Polygon", chainId: 137, symbol: "POL", rpcs: [
            "https://polygon-bor-rpc.publicnode.com", "https://polygon.llamarpc.com", "https://1rpc.io/matic", "https://rpc.ankr.com/polygon", "https://polygon-mainnet.public.blastapi.io",
            "https://polygon.meowrpc.com", "https://rpc-mainnet.maticvigil.com", "https://poly-rpc.gateway.pokt.network", "https://polygon-rpc.com", "https://rpc-mainnet.matic.network"
        ]},
        { name: "Arbitrum", chainId: 42161, symbol: "ETH", rpcs: [
            "https://arbitrum.llamarpc.com", "https://arb1.arbitrum.io/rpc", "https://arbitrum-one.publicnode.com", "https://1rpc.io/arb", "https://rpc.ankr.com/arbitrum",
            "https://arbitrum.meowrpc.com", "https://arb-mainnet.public.blastapi.io", "https://arbitrum.api.onfinality.io/public", "https://arbitrum-mainnet.infura.io/v3/static", "https://endpoints.omniatech.io/v1/arbitrum/mainnet/public"
        ]}
    ];

    let currentAccount = "";

    async function handleAuth() {
        if (window.ethereum) {
            try {
                if (!currentAccount) {
                    const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    currentAccount = accs[0]; updateUI(true);
                } else {
                    currentAccount = ""; updateUI(false);
                }
            } catch (e) { alert("Erro ao conectar carteira."); }
        }
    }

    function updateUI(connected) {
        const authBtn = document.getElementById('authBtn');
        const scanBtn = document.getElementById('scanBtn');
        const walletDisplay = document.getElementById('walletDisplay');

        if (connected) {
            authBtn.innerText = "DESCONECTAR";
            authBtn.classList.add('mode-disconnect');
            scanBtn.style.display = "inline-block";
            walletDisplay.innerHTML = `CARTEIRA ATIVA: ${currentAccount}`;
            runSecurityScan();
        } else {
            authBtn.innerText = "CONECTAR CARTEIRA";
            authBtn.classList.remove('mode-disconnect');
            scanBtn.style.display = "none";
            walletDisplay.innerText = "AGUARDANDO CONEXÃO";
            renderTable();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('netTable');
        tbody.innerHTML = chainData.map(c => `
            <tr>
                <td><b style="color:var(--cyan)">${c.name}</b></td>
                <td>
                    <select class="rpc-select" id="sel-${c.chainId}">
                        ${c.rpcs.map((url, index) => `<option value="${url}">Opção ${index + 1}: ${url.substring(0, 30)}...</option>`).join('')}
                    </select>
                </td>
                <td id="bal-${c.chainId}">---</td>
                <td id="tokens-${c.chainId}"><ul class="token-list"></ul></td>
                <td id="state-${c.chainId}"><span class="status-badge" style="color:#444">PRONTO</span></td>
            </tr>
        `).join('');
    }

    async function runSecurityScan() {
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true;
        scanBtn.innerText = "VARRENDO...";

        for (const chain of chainData) {
            const rpc = document.getElementById(`sel-${chain.chainId}`).value;
            const stateEl = document.getElementById(`state-${chain.chainId}`);
            const tokenEl = document.getElementById(`tokens-${chain.chainId}`).querySelector('ul');
            
            stateEl.innerHTML = `<span style="color:var(--cyan)">LENDO...</span>`;
            tokenEl.innerHTML = "";

            try {
                const provider = new ethers.JsonRpcProvider(rpc, undefined, { staticNetwork: true });
                const bal = await Promise.race([
                    provider.getBalance(currentAccount),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 6000))
                ]);
                
                document.getElementById(`bal-${chain.chainId}`).innerText = `${parseFloat(ethers.formatEther(bal)).toFixed(4)} ${chain.symbol}`;

                for (const tConfig of tokenWatchlist) {
                    if (tConfig.chains.includes(chain.chainId)) {
                        try {
                            const contract = new ethers.Contract(tConfig.address, ERC20_ABI, provider);
                            const tBal = await contract.balanceOf(currentAccount);
                            if (tBal > 0n) {
                                const decimals = await contract.decimals();
                                tokenEl.innerHTML += `<li>• ${parseFloat(ethers.formatUnits(tBal, decimals)).toFixed(2)} ${tConfig.name}</li>`;
                            }
                        } catch (err) {}
                    }
                }
                
                if(tokenEl.innerHTML === "") tokenEl.innerHTML = "<li>Nenhum ativo</li>";
                stateEl.innerHTML = `<span style="color:var(--green)">✅ PROTEGIDO</span>`;

            } catch (e) {
                stateEl.innerHTML = `<span style="color:var(--red)">TIMEOUT</span>`;
            }
        }
        scanBtn.disabled = false;
        scanBtn.innerText = "REPETIR SCAN COMPLETO";
    }

    renderTable();
</script>
</body>
</html>

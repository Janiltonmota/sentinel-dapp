<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel DApp // Phase 12</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #020205; --panel: #0a0a0f; --cyan: #00ffff; --green: #00ff88; --red: #ff3366; --gray: #1a1a2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { width: 100%; max-width: 1150px; margin: 0 auto; }
        
        .header-actions { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .btn-logout { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 5px 12px; font-size: 10px; cursor: pointer; border-radius: 4px; display: none; }
        .btn-logout:hover { background: var(--red); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--panel); border: 1px solid var(--gray); padding: 20px; border-radius: 12px; text-align: center; border-top: 3px solid var(--cyan); transition: 0.3s; }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--green); font-family: monospace; }

        .card { background: var(--panel); border: 1px solid var(--gray); padding: 25px; border-radius: 15px; position: relative; }
        
        .btn-connect { 
            background: transparent; border: 2px solid var(--cyan); color: var(--cyan); 
            padding: 15px 40px; font-size: 16px; cursor: pointer; font-weight: bold; 
            border-radius: 8px; transition: 0.3s; display: block; margin: 0 auto 20px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-connect.active { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #444; font-size: 11px; padding: 15px; border-bottom: 1px solid #222; }
        td { padding: 18px 15px; border-bottom: 1px solid #111; vertical-align: middle; }

        .loading-bar { height: 2px; background: var(--cyan); width: 0%; position: absolute; top: 0; left: 0; transition: 0.3s; border-radius: 15px 15px 0 0; }
        #walletAddr { text-align: center; font-size: 10px; color: #555; font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button id="logoutBtn" class="btn-logout" onclick="disconnect()">DESCONECTAR</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card" id="cardNet">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">PATRIMÔNIO TOTAL</div>
            <div class="stat-value" id="totalUSD">$0,00</div>
        </div>
        <div class="stat-card" id="cardStatus">
            <div style="color:#555; font-size:12px; margin-bottom:5px;">STATUS</div>
            <div class="stat-value" id="walletStatus" style="color:var(--red)">OFFLINE</div>
        </div>
    </div>

    <div class="card">
        <div id="loader" class="loading-bar"></div>
        <button id="mainBtn" class="btn-connect" onclick="handleAction()">Conectar Carteira</button>
        <div id="walletAddr">Aguardando interação...</div>
        
        <table id="targetTable">
            <thead>
                <tr>
                    <th>REDE</th>
                    <th>SALDO NATIVO</th>
                    <th>TOKENS ERC-20</th>
                    <th>RISCOS</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<script>
    const config = {
        chains: [
            { id: '1', name: "Ethereum", sym: "ETH", cgId: "ethereum", tokens: ["0xdAC17F958D2ee523a2206206994597C13D831ec7"] },
            { id: '56', name: "BNB Chain", sym: "BNB", cgId: "binancecoin", tokens: ["0x55d398326f99059fF775485246999027B3197955"] },
            { id: '137', name: "Polygon", sym: "POL", cgId: "matic-network", tokens: ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F"] },
            { id: '42161', name: "Arbitrum", sym: "ETH", cgId: "ethereum", tokens: ["0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"] }
        ]
    };

    let userAddress = "";

    // Inicialização e Auto-Login
    async function init() {
        renderTable();
        if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_accounts' });
            if (accounts.length > 0) {
                userAddress = accounts[0];
                updateUI(true);
            }
            
            window.ethereum.on('accountsChanged', (accs) => {
                if (accs.length === 0) disconnect();
                else { userAddress = accs[0]; updateUI(true); }
            });
        }
    }

    function renderTable() {
        document.getElementById('mainTable').innerHTML = config.chains.map(c => `
            <tr>
                <td><strong>${c.name}</strong></td>
                <td id="bal-${c.id}">---</td>
                <td id="tokens-${c.id}">---</td>
                <td id="risk-${c.id}">Aguardando scan...</td>
            </tr>
        `).join('');
    }

    function updateUI(connected) {
        const btn = document.getElementById('mainBtn');
        const status = document.getElementById('walletStatus');
        const logout = document.getElementById('logoutBtn');

        if (connected) {
            btn.innerText = "Executar Scan de Segurança";
            btn.classList.add('active');
            status.innerText = "ONLINE";
            status.style.color = "var(--green)";
            logout.style.display = "block";
            document.getElementById('walletAddr').innerText = `CONECTADO: ${userAddress}`;
        } else {
            btn.innerText = "Conectar Carteira";
            btn.classList.remove('active');
            status.innerText = "OFFLINE";
            status.style.color = "var(--red)";
            logout.style.display = "none";
            document.getElementById('walletAddr').innerText = "Desconectado.";
            renderTable();
        }
    }

    async function handleAction() {
        if (!userAddress) {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accs[0];
            updateUI(true);
        } else {
            startScan();
        }
    }

    function disconnect() {
        userAddress = "";
        updateUI(false);
    }

    async function startScan() {
        const btn = document.getElementById('mainBtn');
        const loader = document.getElementById('loader');
        btn.disabled = true;
        btn.innerText = "ESCANEANDO...";
        
        let totalUSD = 0;
        
        // Simulação de progresso e busca de preços
        for (let i = 0; i < config.chains.length; i++) {
            const chain = config.chains[i];
            loader.style.width = `${((i + 1) / config.chains.length) * 100}%`;
            
            // Aqui entraria a lógica de ethers.js da fase anterior para cada rede
            // Exemplo visual rápido:
            document.getElementById(`bal-${chain.id}`).innerText = "Lendo rede...";
            await new Promise(r => setTimeout(r, 600)); 
            document.getElementById(`bal-${chain.id}`).innerText = "0.00 " + chain.sym;
        }

        btn.disabled = false;
        btn.innerText = "REPETIR SCAN";
        loader.style.width = "0%";
    }

    init();
</script>
</body>
</html>

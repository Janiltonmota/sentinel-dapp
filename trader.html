<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Hyperliquid Custom - Trader</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 60px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            border-right: 1px solid #333;
        }

        .sidebar-icon {
            width: 40px;
            height: 40px;
            margin: 15px 0;
            border-radius: 8px;
            background: #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sidebar-icon:hover {
            background: #00ff88;
            color: black;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            padding: 8px 16px;
            background: #2d2d4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .wallet-info {
            font-size: 14px;
            color: #00ff88;
        }

        #chart-container {
            flex: 2;
            background: #121220;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .order-panel {
            flex: 1;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #2d2d4a;
            color: white;
            font-size: 14px;
        }

        .btn-buy {
            background: #00ff88;
            color: black;
            font-weight: bold;
            flex: 1;
        }

        .btn-sell {
            background: #ff3366;
            color: white;
            font-weight: bold;
            flex: 1;
        }

        .price-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }

        .platform-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .platform-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #2d2d4a;
            color: white;
            border: 1px solid #00ff88;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .platform-btn:hover {
            background: #3d3d5a;
            border-color: #00ff88;
        }

        .platform-badge {
            display: flex;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            margin-left: 4px;
        }

        .assets-dropdown {
            position: relative;
            min-width: 200px;
        }

        .dropdown-btn {
            width: 100%;
            padding: 10px;
            background: #2d2d4a;
            color: white;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .dropdown-btn:hover {
            background: #3d3d5a;
            border-color: #00ff88;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a2e;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #2d2d4a;
        }

        .dropdown-item:hover {
            background: #2d2d4a;
            color: #00ff88;
        }

        .info-badge {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            min-width: 280px;
            font-size: 12px;
        }

        .badge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #2d2d4a;
            padding-bottom: 8px;
        }

        .badge-title {
            font-weight: bold;
            color: #00ff88;
        }

        .badge-status {
            display: flex;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
        }

        .badge-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #2d2d4a;
        }

        .badge-info-row:last-child {
            border-bottom: none;
        }

        .badge-label {
            color: #888;
            font-size: 11px;
        }

        .badge-value {
            font-weight: bold;
            color: #00ff88;
        }

        .badge-value.negative {
            color: #ff3366;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <div class="sidebar">
        <div class="sidebar-icon"></div>
        <div class="sidebar-icon">⚙️</div>
        <div class="sidebar-icon">💰</div>
        <div class="sidebar-icon">📊</div>
        <div class="sidebar-icon"></div>
    </div>

    <!-- Área Principal -->
    <div class="main-content">
        <div class="header-bar">
            <button class="back-btn" onclick="goBack()">← Voltar</button>
            
            <div class="platform-section">
                <!-- Botão de Plataforma -->
                <button class="platform-btn" id="platform-btn" onclick="toggleAssetDropdown()">
                    🔗 Hyperliquid
                    <div class="platform-badge"></div>
                </button>

                <!-- Dropdown de Ativos -->
                <div class="assets-dropdown">
                    <button class="dropdown-btn" id="asset-selector" onclick="toggleAssetDropdown()">
                        <span id="selected-asset">Selecionar Ativo</span>
                        <span>▼</span>
                    </button>
                    <div class="dropdown-menu" id="assets-menu"></div>
                </div>

                <!-- Info Badge -->
                <div class="info-badge" id="info-badge">
                    <div class="badge-header">
                        <div class="badge-title" id="badge-asset">-</div>
                        <div class="badge-status"></div>
                    </div>
                    <div class="badge-info-row">
                        <span class="badge-label">Alavancagem:</span>
                        <span class="badge-value" id="badge-leverage">-</span>
                    </div>
                    <div class="badge-info-row">
                        <span class="badge-label">PNL:</span>
                        <span class="badge-value" id="badge-pnl">-</span>
                    </div>
                    <div class="badge-info-row">
                        <span class="badge-label">Saldo:</span>
                        <span class="badge-value" id="badge-balance">-</span>
                    </div>
                    <div class="badge-info-row">
                        <span class="badge-label">Entrada Limit:</span>
                        <span class="badge-value" id="badge-limit">-</span>
                    </div>
                    <div class="badge-info-row">
                        <span class="badge-label">Entrada Mercado:</span>
                        <span class="badge-value" id="badge-market">-</span>
                    </div>
                </div>
            </div>

            <div class="wallet-info" id="wallet-address">Carteira não conectada</div>
        </div>

        <!-- Gráfico -->
        <div id="chart-container"></div>

        <!-- Boleta -->
        <div class="order-panel">
            <h3>Boleta de Trading - BTC-USDC</h3>
            
            <div class="price-display" id="current-price">Carregando...</div>

            <div class="input-group">
                <input type="number" placeholder="Quantidade (BTC)" id="amount" value="0.01" step="0.001">
                <select id="order-type">
                    <option value="limit">Limit</option>
                    <option value="market">Market</option>
                </select>
            </div>

            <div class="input-group">
                <input type="number" placeholder="Preço (USDC)" id="price" value="">
                <button onclick="setMarketPrice()">Usar Preço Atual</button>
            </div>

            <div class="input-group">
                <button class="btn-buy" onclick="placeOrder('buy')">COMPRAR</button>
                <button class="btn-sell" onclick="placeOrder('sell')">VENDER</button>
            </div>
        </div>
    </div>

<script>
    let chart;
    let candleSeries;
    let allAssets = [];
    let selectedAsset = null;
    let portfolioData = {};

    // Verificar se há carteira conectada
    window.onload = () => {
        const wallet = localStorage.getItem('hyperliquid_wallet');
        if (wallet) {
            document.getElementById('wallet-address').innerText = `Carteira: ${wallet.substr(0, 6)}...${wallet.substr(-4)}`;
        } else {
            alert('Você precisa conectar sua carteira na landing page primeiro!');
            window.location.href = 'index.html';
        }

        initChart();
        loadHyperliquidAssets();
        fetchCurrentPrice();
        setInterval(fetchCurrentPrice, 5000);
        setInterval(updateTraderInfo, 10000);
    };

    // Carregar ativos da Hyperliquid via API
    async function loadHyperliquidAssets() {
        try {
            const response = await fetch('https://api.hyperliquid.xyz/info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'allAssets' })
            });
            const assets = await response.json();
            
            if (Array.isArray(assets)) {
                allAssets = assets.filter(asset => asset.name).sort((a, b) => a.name.localeCompare(b.name));
                populateAssetDropdown(allAssets);
            }
        } catch (error) {
            console.error('Erro ao carregar ativos:', error);
        }
    }

    // Preencher dropdown com ativos
    function populateAssetDropdown(assets) {
        const menu = document.getElementById('assets-menu');
        menu.innerHTML = '';
        
        assets.forEach(asset => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.textContent = asset.name;
            item.onclick = () => selectAsset(asset);
            menu.appendChild(item);
        });
    }

    // Selecionar ativo
    function selectAsset(asset) {
        selectedAsset = asset;
        document.getElementById('selected-asset').textContent = asset.name;
        document.getElementById('assets-menu').classList.remove('active');
        document.getElementById('badge-asset').textContent = asset.name;
        
        // Simular dados do trader
        updateAssetInfo(asset);
    }

    // Atualizar informações do ativo
    function updateAssetInfo(asset) {
        // Simulando dados de trading - em produção viriam da API
        const mockLeverage = (1 + Math.random() * 10).toFixed(1);
        const mockBalance = (100 + Math.random() * 10000).toFixed(2);
        const mockPnL = (Math.random() - 0.5) * 5000;
        const mockLimitEntry = (1000 + Math.random() * 100000).toFixed(2);
        const mockMarketEntry = (1000 + Math.random() * 100000).toFixed(2);

        document.getElementById('badge-leverage').textContent = `${mockLeverage}x`;
        document.getElementById('badge-balance').textContent = `$${mockBalance}`;
        document.getElementById('badge-pnl').textContent = mockPnL >= 0 ? `+$${mockPnL.toFixed(2)}` : `-$${Math.abs(mockPnL).toFixed(2)}`;
        document.getElementById('badge-pnl').classList.toggle('negative', mockPnL < 0);
        document.getElementById('badge-limit').textContent = `$${mockLimitEntry}`;
        document.getElementById('badge-market').textContent = `$${mockMarketEntry}`;

        portfolioData[asset.name] = {
            leverage: mockLeverage,
            balance: mockBalance,
            pnl: mockPnL,
            limitEntry: mockLimitEntry,
            marketEntry: mockMarketEntry
        };
    }

    // Alternar dropdown
    function toggleAssetDropdown() {
        const menu = document.getElementById('assets-menu');
        menu.classList.toggle('active');
    }

    // Fechar dropdown ao clicar fora
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.assets-dropdown')) {
            document.getElementById('assets-menu').classList.remove('active');
        }
    });

    // Atualizar informações de trader periodicamente
    async function updateTraderInfo() {
        if (!selectedAsset) return;
        
        try {
            const response = await fetch('https://api.hyperliquid.xyz/info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'userState', user: localStorage.getItem('hyperliquid_wallet') })
            });
            
            if (response.ok) {
                const userData = await response.json();
                // Atualizar badge com dados reais se disponíveis
                if (userData.portfolio) {
                    updateAssetInfo(selectedAsset);
                }
            }
        } catch (error) {
            console.error('Erro ao atualizar info do trader:', error);
        }
    }

    function goBack() {
        window.location.href = 'index.html';
    }

    function initChart() {
        const chartContainer = document.getElementById('chart-container');
        chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: { backgroundColor: '#121220', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            rightPriceScale: { borderColor: '#2B2B43' },
            timeScale: { borderColor: '#2B2B43' },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff88',
            downColor: '#ff3366',
            borderVisible: false,
            wickUpColor: '#00ff88',
            wickDownColor: '#ff3366',
        });

        window.addEventListener('resize', () => {
            if (chart) {
                chart.applyOptions({ 
                    width: chartContainer.clientWidth, 
                    height: chartContainer.clientHeight 
                });
            }
        });

        loadHistoricalData();
    }

    async function fetchCurrentPrice() {
        try {
            const response = await fetch('https://api.hyperliquid.xyz/info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'allMids' })
            });
            const data = await response.json();
            const btcPrice = parseFloat(data.BTC).toFixed(2);
            document.getElementById('current-price').innerText = `$${btcPrice}`;
            if (document.getElementById('price').value === '') {
                document.getElementById('price').value = btcPrice;
            }
        } catch (error) {
            console.error('Erro ao buscar preço:', error);
            document.getElementById('current-price').innerText = 'Erro';
        }
    }

    function setMarketPrice() {
        const price = document.getElementById('current-price').innerText.replace('$', '');
        document.getElementById('price').value = price;
    }

    function placeOrder(side) {
        const amount = document.getElementById('amount').value;
        const price = document.getElementById('price').value;
        const type = document.getElementById('order-type').value;

        alert(`Ordem ${side.toUpperCase()} enviada:\nQuantidade: ${amount} BTC\nPreço: $${price}\nTipo: ${type}\n\n(Esta é uma simulação — integração real vem depois!)`);
    }

    function loadHistoricalData() {
        const now = Math.floor(Date.now() / 1000);
        const candles = [];
        let price = 79000;
        for (let i = 0; i < 100; i++) {
            const open = price;
            const close = price + (Math.random() - 0.5) * 500;
            const high = Math.max(open, close) + Math.random() * 200;
            const low = Math.min(open, close) - Math.random() * 200;
            candles.push({
                time: now - (100 - i) * 60,
                open, high, low, close
            });
            price = close;
        }
        candleSeries.setData(candles);
    }
</script>

</body>
</html>
